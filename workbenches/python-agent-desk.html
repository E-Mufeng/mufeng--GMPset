<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>1个月 Python→Agent 学习工作台 v2</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1f2533;--sub:#5b6472;--line:#e6e9f0;
--brand:#2f6df6;--brand2:#7c4dff;--ok:#1aa672;--warn:#e0823d;
--learn:#eef4ff;--doc:#e8f1ff;--vid:#fdeaf3;--do:#eafaf1}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.62}
header{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,#2f6df6,#7c4dff);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-size:16px;margin:0;font-weight:700}
header .meta{font-size:12px;opacity:.92}
nav{display:flex;gap:6px;flex-wrap:wrap;background:#fff;padding:8px 14px;border-bottom:1px solid var(--line);position:sticky;top:50px;z-index:15}
nav button{border:1px solid var(--line);background:#fff;color:var(--sub);padding:6px 12px;border-radius:20px;cursor:pointer;font-size:13px}
nav button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,30,60,.04)}
h2{font-size:16px;margin:2px 0 12px}h3{font-size:14px;margin:14px 0 8px;color:var(--sub)}
.grid{display:grid;gap:12px}.cols2{grid-template-columns:1fr 1fr}
@media(max-width:760px){.cols2{grid-template-columns:1fr}}
.cal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media(max-width:760px){.cal{grid-template-columns:repeat(3,1fr)}}
.daybtn{position:relative;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer}
.daybtn:hover{border-color:var(--brand)}
.daybtn .d{font-weight:700;font-size:13px}.daybtn .p{font-size:10px;color:var(--sub)}
.daybtn.done{background:#eafaf1;border-color:#bdebd0}
.daybtn .dot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:#cfd6e4}
.daybtn.done .dot{background:var(--ok)}
.stat{display:flex;gap:14px;flex-wrap:wrap}
.stat .b{flex:1;min-width:120px;background:#f3f6ff;border:1px solid #dde6ff;border-radius:12px;padding:12px}
.stat .b b{font-size:20px;color:var(--brand)}
.badge{display:inline-block;background:var(--brand2);color:#fff;font-size:11px;padding:2px 9px;border-radius:20px;margin-right:6px}
.hours{font-size:12px;color:var(--sub)}
.phasebar{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.rationale{background:#fffbe9;border:1px solid #ffe2a0;border-radius:8px;padding:8px 10px;font-size:12.5px;color:#6b5a2a;margin-bottom:10px}
.sub{margin-bottom:10px}
.sub.done{border-color:var(--ok)}
.sub .top{display:flex;align-items:center;gap:8px;cursor:pointer}
.sub .top input{transform:scale(1.15);accent-color:var(--ok)}
.sub .nm{font-weight:700;font-size:13.5px}
.sub .time{font-size:11px;color:#fff;background:var(--brand);padding:1px 8px;border-radius:10px}
.sub .kp{font-size:11px;color:var(--brand2);margin-left:4px}
.learn{background:var(--learn);border:1px solid #d6e2ff;border-radius:10px;padding:9px 11px;font-size:13px;margin:7px 0}
.resrow{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 2px}
.res{color:var(--brand);text-decoration:none;border-bottom:1px dashed #aac3ff;font-size:12.5px}
.res:hover{color:var(--brand2)}
.rtag{font-size:10px;padding:1px 7px;border-radius:6px;margin-right:4px}
.rtag.doc{background:var(--doc);color:#1f5fd0}.rtag.vid{background:var(--vid);color:#c2186a}
.do{background:var(--do);border:1px solid #bfe9cf;border-radius:10px;padding:8px 11px;font-size:13px;margin-top:5px}
.do b{color:#1a8a5a}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;font-size:13px;resize:vertical}
.kp{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:#eef2ff;border:1px solid #d6deff;color:#33408a;font-size:12px;padding:3px 9px;border-radius:20px;cursor:pointer}
.chip.m{background:#eafaf1;border-color:#bdebd0;color:#1a8a5a;text-decoration:line-through}
.revbox{background:#f0ecff;border:1px solid #ddd0ff;border-radius:12px;padding:12px}
.revq{margin:6px 0;font-size:13px}
.btn{border:none;background:var(--brand);color:#fff;padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13px}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.ok{background:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.libcat{margin-bottom:8px}
.libcat .tt{font-weight:700;color:var(--brand2);margin-bottom:3px}
.libitem{display:block;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.why{color:var(--sub);font-size:12px}
.notebook{white-space:pre-wrap;font-size:13px;color:var(--ink)}
.tip{font-size:12px;color:var(--sub);background:#fffbe9;border:1px solid #ffe9a8;border-radius:8px;padding:8px 10px;margin:8px 0}
.out{background:#eafaf1;border:1px solid #bfe9cf;border-radius:10px;padding:10px 12px;font-size:13px;margin:5px 0}
.sc{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.sc .role{font-weight:700;color:var(--brand2)}
.sc .v{color:var(--sub);font-size:13px;margin:4px 0}
.sc .f{background:#eafaf1;border:1px solid #bfe9cf;border-radius:8px;padding:7px 9px;font-size:12.5px;margin-top:4px}
.foot{text-align:center;color:var(--sub);font-size:12px;padding:18px}
</style>
</head>
<body>
<header>
  <h1>📘 1个月 · Python核心 → 大模型 Agent 学习工作台 v2</h1>
  <div class="meta" id="hdrMeta">每天 6–8h · 课后≤1h · 子任务细分 · 资料1:1 · 文档直接可读</div>
</header>
<nav id="nav">
  <button data-v="dash" class="active">总览</button>
  <button data-v="day">每日计划</button>
  <button data-v="lib">资源库</button>
  <button data-v="notes">笔记与统计</button>
  <button data-v="self">设计自检</button>
</nav>
<div class="wrap" id="app"></div>
<div class="foot">数据仅存于本机浏览器(localStorage)，可随时导出备份。所有外链为免费稳定链接；文档一律指向精确可读页。</div>

let state={view:"dash",day:1};

  mark.onclick=()=>{set(LS.done(x.d),!get(LS.done(x.d),false));render()};
  row.append(prev,next,mark);top.appendChild(row);app.appendChild(top);

  const subs=get(LS.sub(x.d),x.subs.map(()=>false));
  const sb=el("div","card");sb.appendChild(el("h2",null,"🎯 今日细分学习任务（资料与任务一一对应）"));
  x.subs.forEach((s,i)=>{
    const card=el("div","sub"+(subs[i]?" done":""));
    const head=el("div","top");
    const cb=el("input");cb.type="checkbox";cb.checked=subs[i];
    cb.onchange=()=>{subs[i]=cb.checked;set(LS.sub(x.d),subs[i]);card.className="sub"+(subs[i]?" done":"")};
    head.append(cb,el("span","nm",(i+1)+". "+s.n),el("span","time",s.time),el("span","kp","· "+s.kp));
    card.appendChild(head);
    card.appendChild(el("div","learn","📖 "+s.learn));
    const rr=el("div","resrow");
    if(s.doc)rr.appendChild(el("span",null,`<span class="rtag doc">文档</span><a class="res" href="${s.doc.u}" target="_blank" rel="noopener">${s.doc.t}</a>`));
    if(s.vid)rr.appendChild(el("span",null,`<span class="rtag vid">视频</span><a class="res" href="${s.vid.u}" target="_blank" rel="noopener">${s.vid.t}</a>`));
    if(s.doc||s.vid)card.appendChild(rr);
    card.appendChild(el("div","do","✍️ <b>练习：</b>"+s.do));
    sb.appendChild(card);
  });
  app.appendChild(sb);

  const nb=el("div","card");nb.appendChild(el("h2",null,"📝 笔记（自动保存）"));
  const ta=el("textarea");ta.value=get(LS.note(x.d),"");
  ta.placeholder="记录当日关键代码、踩坑、理解偏差…（课后≤1h 主要做这件事）";
  ta.oninput=()=>set(LS.note(x.d),ta.value);nb.appendChild(ta);
  nb.appendChild(el("h3",null,"🏷️ 知识点（点击切「已掌握」）"));
  const kpWrap=el("div","kp");
  let kp=get(LS.kp(x.d),x.knowledge.map(t=>({t,m:false})));
  x.knowledge.forEach(t=>{if(!kp.find(k=>k.t===t))kp.push({t,m:false})});
  kp.forEach((k,i)=>{const c=el("span","chip"+(k.m?" m":""),k.t);
    c.onclick=()=>{kp[i].m=!kp[i].m;set(LS.kp(x.d),kp);c.className="chip"+(kp[i].m?" m":"")};
    kpWrap.appendChild(c)});
  nb.appendChild(kpWrap);app.appendChild(nb);

  const rb=el("div","card");rb.appendChild(el("h2",null,"🤖 当日审查 AI（核查笔记与成果）"));
  rb.appendChild(el("div","tip",TIPS.review));
  const rev=el("div","revbox");
  rev.appendChild(el("div",null,"<b>自查清单</b>（逐项打勾，全部通过即达标）："));
  x.review.forEach(q=>{const r=el("label","revq");r.innerHTML=`<input type="checkbox"> ${q}`;rev.appendChild(r)});
  const gen=el("button","btn","生成「提交 AI 审查」请求文案");
  gen.onclick=()=>{const note=get(LS.note(x.d),"（空）");const kps=x.knowledge.join("、");
    const txt=`【第${x.d}天 学习审查请求】\n主题：${x.phase} · ${x.title}\n当日知识点：${kps}\n我的笔记：\n${note}\n请帮我：1)指出理解偏差/误区；2)补充工程落地要点；3)出1道验收小题并给参考答案。`;
    const ta2=el("textarea");ta2.value=txt;ta2.style.minHeight="140px";ta2.onclick=()=>ta2.select();
    rev.appendChild(el("div",null,"<br><b>复制以下内容发给我（WorkBuddy）即可获得审查反馈：</b>"));rev.appendChild(ta2)};
  const g2=el("div","row");g2.appendChild(gen);rev.appendChild(g2);rb.appendChild(rev);app.appendChild(rb);
}

/* 资源库（分类 + 用途标注） */
function renderLib(app){
  const c=el("div","card");c.appendChild(el("h2",null,"📚 资源库（按类别整理，全部免费稳定）"));
  c.appendChild(el("div","tip","「阅读页」点开即学当日知识点；「源码参考」是代码仓库，仅供查用法/跑示例，不在每日文档里直接跳转。视频统一搜索/频道入口避免死链。"));
  app.appendChild(c);
  Object.entries(LIB).forEach(([cat,items])=>{
    const cc=el("div","card");cc.appendChild(el("h3",null,"▸ "+cat));
    items.forEach(it=>{const d=el("div","libitem");
      d.innerHTML=`<a class="res" href="${it[1]}" target="_blank" rel="noopener">${it[0]}</a> <span class="why">— ${it[2]}</span>`;
      cc.appendChild(d)});app.appendChild(cc)});
}

/* 笔记与统计（去重 + Markdown 导出） */
function renderNotes(app){
  const c=el("div","card");c.appendChild(el("h2",null,"📒 笔记与知识点统计"));
  let kpAll=[];DAYS.forEach(x=>{const kp=get(LS.kp(x.d),x.knowledge.map(t=>({t,m:false})));kpAll.push(...kp)});
  const uniq={};kpAll.forEach(k=>{uniq[k.t]=uniq[k.t]||{m:false,cnt:0};if(k.m)uniq[k.t].m=true;uniq[k.t].cnt++});
  const total=Object.keys(uniq).length,master=Object.values(uniq).filter(v=>v.m).length;
  const st=el("div","stat");
  st.innerHTML=`<div class="b">独立知识点<br><b>${total}</b></div><div class="b">已掌握<br><b>${master}</b></div>
    <div class="b">掌握率<br><b>${total?(master/total*100).toFixed(0):0}%</b></div>`;
  c.appendChild(st);
  const exp=el("button","btn","导出笔记(Markdown)");
  exp.onclick=()=>{let md="# 30天学习笔记\n\n";DAYS.forEach(x=>{const n=get(LS.note(x.d),"");if(n.trim()){md+=`## D${x.d} ${x.title}\n\n${n}\n\n`}});
    const b=new Blob([md],{type:"text/markdown"});const a=el("a");a.href=URL.createObjectURL(b);a.download="学习笔记.md";a.click()};
  const expj=el("button","btn ghost","导出备份(JSON)");
  expj.onclick=()=>{const data={notes:DAYS.map(x=>({d:x.d,note:get(LS.note(x.d),"")})),kp:kpAll,done:DAYS.map(x=>({d:x.d,done:get(LS.done(x.d),false)}))};
    const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=el("a");a.href=URL.createObjectURL(b);a.download="学习备份.json";a.click()};
  c.appendChild(el("div","row","").append(exp,expj));app.appendChild(c);

  const kpc=el("div","card");kpc.appendChild(el("h2",null,"🏷️ 知识点清单（跨天去重，点击某天复习）"));
  DAYS.forEach(x=>{const kp=get(LS.kp(x.d),x.knowledge.map(t=>({t,m:false})));
    const line=el("div","libitem");
    line.innerHTML=`<b>D${x.d}</b> `+(x.knowledge.map(t=>{const m=uniq[t]&&uniq[t].m;return `<span class="chip${m?" m":""}">${t}</span>`}).join(" "));
    line.style.cursor="pointer";line.onclick=()=>{state.view="day";state.day=x.d;render()};kpc.appendChild(line)});
  app.appendChild(kpc);
  const nc=el("div","card");nc.appendChild(el("h2",null,"📄 全部笔记拼接"));
  let allNote="";DAYS.forEach(x=>{const n=get(LS.note(x.d),"");if(n.trim())allNote+=`\n【D${x.d} ${x.title}】\n${n}\n`});
  nc.appendChild(el("div","notebook",allNote||"（暂无笔记）"));app.appendChild(nc);
}

/* 设计自检（三轮） */
function renderSelf(app){
  const c=el("div","card");c.appendChild(el("h2",null,"🔍 设计自检报告（初学者视角 · 循环三轮）"));
  c.appendChild(el("div","tip","定位：以「即将开始学习的初学者」身份评估框架，收集看法与可完善点，循环三轮并据改。下方为三轮记录与已落地的修正。"));
  app.appendChild(c);
  SELFCHECK.forEach(r=>{const sc=el("div","sc");
    sc.appendChild(el("div","role",`第 ${r.round} 轮 · ${r.role}`));
    sc.appendChild(el("div","v","<b>初学者看法：</b>"));
    r.views.forEach(v=>sc.appendChild(el("div","v","• "+v)));
    sc.appendChild(el("div","f","<b>已据改：</b>"));
    r.fix.forEach(f=>sc.appendChild(el("div","f","✓ "+f)));
    app.appendChild(sc)});
}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{state.view=b.dataset.v;if(b.dataset.v==="day"&&!state.day)state.day=1;render()});
render();
</script>
