  .rr-fh-actions{display:flex;gap:6px;}
  .rr-file-list{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px;}
  .rr-file{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:10px;border:1px solid transparent;background:var(--bg-2);cursor:pointer;text-align:left;transition:.15s;}
  .rr-file:hover{border-color:var(--bd-2);}
  .rr-file.active{background:var(--ac-soft);border-color:var(--ac);}
  .rr-file-name{font-size:13.5px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rr-file-meta{font-size:11.5px;color:var(--txt-3);}
  .rr-links{padding:10px 14px;border-top:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:6px;}
  .rr-links-h{width:100%;font-size:12px;color:var(--txt-3);margin-bottom:2px;}
  .rr-link{font-size:12px;color:var(--ac);text-decoration:none;background:var(--bg-2);border:1px solid var(--bd);border-radius:8px;padding:3px 9px;}

  .rr-empty{color:var(--txt-3);font-size:13px;padding:16px 8px;text-align:center;}
  .rr-reader{position:relative;display:flex;flex-direction:column;min-height:0;background:var(--bg-1);}
  .rr-reader-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--txt-3);font-size:15px;}
  .rr-reader-head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--bd);background:var(--bg-2);}
  .rr-rh-title{font-size:15px;font-weight:600;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rr-rh-actions{display:flex;gap:6px;flex-shrink:0;}
  .rr-progress{height:3px;background:var(--bg-3);}

  .rr-text{flex:1;overflow-y:auto;padding:24px 32px;line-height:1.95;font-size:16px;color:var(--txt);}
  .rr-tline{white-space:pre-wrap;word-break:break-word;min-height:1.95em;}
  .rr-chap{white-space:pre-wrap;word-break:break-word;font-weight:700;font-size:17px;color:var(--ac);margin-top:14px;min-height:1.95em;}
  .rr-binary{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;}
  .rr-bin-type{font-size:20px;font-weight:700;color:var(--txt);}
  .rr-bin-tip{color:var(--txt-3);font-size:13px;max-width:420px;text-align:center;line-height:1.7;}
  .rr-search-panel{padding:12px 18px;border-bottom:1px solid var(--bd);background:var(--bg-2);display:flex;flex-direction:column;gap:8px;}
  .rr-search-panel .util-input{width:100%;}
  .rr-search-res{max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;}
  .rr-sr{padding:8px 10px;border-radius:8px;background:var(--bg-3);cursor:pointer;}
  .rr-sr:hover{background:var(--ac-soft);}
  .rr-sr-ch{display:block;font-size:12px;color:var(--ac);margin-bottom:2px;}
  .rr-sr-txt{font-size:12.5px;color:var(--txt-2);white-space:pre-wrap;}
  .rr-book{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:10px;background:var(--bg-2);border:1px solid transparent;}
  .rr-book:hover{border-color:var(--bd-2);}
  .rr-book-name{font-size:14px;color:var(--txt);font-weight:600;}
  .rr-book-meta{font-size:12px;color:var(--txt-3);}
  .rr-book-actions{display:flex;gap:6px;margin-top:4px;}
  .rr-toc-panel{position:absolute;right:18px;top:56px;max-height:60%;overflow-y:auto;width:240px;background:var(--bg-2);border:1px solid var(--bd-2);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:8px;z-index:20;display:flex;flex-direction:column;gap:2px;}
  .rr-toc-item{padding:7px 10px;border-radius:8px;font-size:13px;color:var(--txt-2);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  @media (max-width:900px){ .rr-body{grid-template-columns:1fr;} .rr-cats{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--bd);} .rr-files{border-right:none;border-bottom:1px solid var(--bd);} }
  /* ===== 音乐中心 ===== */
  .music-page{display:flex;flex-direction:column;min-height:0;height:100%;}
  .ms-main{flex:1;display:flex;min-height:0;}
  .ms-side{width:280px;flex-shrink:0;border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0;background:var(--bg-1);}
  .ms-side-sec{padding:12px 14px 6px;font-size:12px;color:var(--txt-3);font-weight:600;letter-spacing:.04em;display:flex;align-items:center;justify-content:space-between;}
  .ms-pl-list{overflow-y:auto;max-height:160px;padding:0 8px 8px;}
  .ms-pl{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--txt-2);}
  .ms-pl:hover{background:var(--ac-soft);color:var(--ac);}
  .ms-pl.active{background:var(--ac-soft);color:var(--ac);font-weight:600;}
  .ms-pl-del{margin-left:auto;color:var(--txt-3);font-size:12px;}
  .ms-pl-del:hover{color:var(--danger);}
  .ms-list{flex:1;overflow-y:auto;padding:6px 8px 90px;min-height:0;}
  .ms-song{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13.5px;border:1px solid transparent;}
  .ms-song:hover{background:var(--bg-2);}
  .ms-song.active{background:var(--ac-soft);border-color:var(--ac);}
  .ms-song-ico{width:30px;height:30px;border-radius:7px;background:var(--ac-soft);color:var(--ac);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ms-song-meta{flex:1;min-width:0;}
  .ms-song-title{font-weight:600;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ms-song-sub{font-size:11.5px;color:var(--txt-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ms-song-act{display:flex;gap:4px;flex-shrink:0;}
  .ms-song-act .btn{padding:3px 7px;font-size:11px;}
  .ms-now{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--bg-0);}
  .ms-now-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--txt-3);gap:10px;}
  .ms-now-empty svg{opacity:.4;}
  .ms-now-head{padding:16px 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--bd);}
  .ms-cover{width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac-2));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  .ms-now-title{font-size:17px;font-weight:700;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ms-now-artist{font-size:13px;color:var(--txt-3);}
  .ms-now-body{flex:1;overflow-y:auto;padding:14px 20px;}
  .ms-queue-h{font-size:12px;color:var(--txt-3);font-weight:600;margin:6px 0 8px;}
  .ms-queue-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;}
  .ms-queue-row:hover{background:var(--bg-2);}
  .ms-queue-row.active{background:var(--ac-soft);color:var(--ac);}
  .ms-queue-num{width:20px;text-align:center;color:var(--txt-3);font-size:12px;flex-shrink:0;}
  .ms-player{height:74px;flex-shrink:0;border-top:1px solid var(--bd);background:var(--bg-1);display:flex;align-items:center;gap:16px;padding:0 20px;}
  .ms-ctrls{display:flex;align-items:center;gap:10px;}
  .ms-ctrls .btn{border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;padding:0;}
  .ms-play-btn{width:46px;height:46px;background:var(--ac);color:#fff;border:none;}
  .ms-play-btn:hover{background:var(--ac-2);}
  .ms-seek{flex:1;display:flex;align-items:center;gap:10px;}
  .ms-time{font-size:11.5px;color:var(--txt-3);font-variant-numeric:tabular-nums;min-width:38px;text-align:center;}
  .ms-range{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:var(--bd);outline:none;}
  .ms-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;background:var(--ac);cursor:pointer;}
  .ms-range::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--ac);cursor:pointer;}
  .ms-vol{display:flex;align-items:center;gap:6px;width:120px;}
  .ms-vol .ms-range{flex:1;}
  .ms-lib-path{font-size:11px;color:var(--txt-3);padding:0 14px 6px;}
  @media (max-width:900px){ .ms-side{width:200px;} .ms-player{flex-wrap:wrap;height:auto;padding:8px 12px;gap:10px;} }

  @media (max-width:640px){ .landing-stats{grid-template-columns:repeat(2,1fr);} .landing-title{font-size:32px;} }

  /* P0 原型占位提示：未完成后端对接的工具统一显示，禁止空白 #tb-host */

  .tb-prototype-placeholder .tp-icon{font-size:64px;line-height:1;opacity:.85;}
  .tb-prototype-placeholder .tp-title{font-size:22px;font-weight:700;color:var(--txt);margin:0;}
  .tb-prototype-placeholder .tp-tag{display:inline-block;padding:6px 16px;border-radius:999px;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac-2);font-size:14px;font-weight:600;border:1px solid color-mix(in srgb,var(--ac) 30%,transparent);}
  .tb-prototype-placeholder .tp-sub{font-size:13px;color:var(--txt-3);max-width:480px;line-height:1.9;}

  /* Phase0 · AI 应用统一工作台 */
  .ai-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:22px 24px 6px;flex-wrap:wrap;}
  .ai-head h1{margin:0;font-size:21px;font-weight:800;color:var(--ink);}

  .ai-head-actions{display:flex;align-items:center;gap:10px;}

  .ai-group{padding:8px 24px 4px;}

  .ai-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:0 24px 24px;}

  .ai-card:hover{border-color:color-mix(in srgb,var(--ac) 40%,var(--line));box-shadow:var(--shadow);transform:translateY(-2px);}
  .ai-card-top{display:flex;align-items:center;gap:12px;}
  .ai-card-icon{width:42px;height:42px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac-2);}
  .ai-card-icon svg{width:22px;height:22px;}
  .ai-card-title{flex:1;min-width:0;}
  .ai-card-title .t-name{font-size:15px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;}
  .ai-card-title .t-desc{font-size:12px;color:var(--txt-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ai-dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--txt-3);box-shadow:0 0 0 3px color-mix(in srgb,var(--txt-3) 18%,transparent);}

  .ai-dot.off{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.16);}
  .ai-kind-tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg-3);color:var(--txt-2);border:1px solid var(--line);}
  .ai-kind-tag.web{color:#0ea5e9;background:color-mix(in srgb,#0ea5e9 12%,transparent);border-color:color-mix(in srgb,#0ea5e9 28%,transparent);}
  .ai-kind-tag.service{color:#8b5cf6;background:color-mix(in srgb,#8b5cf6 12%,transparent);border-color:color-mix(in srgb,#8b5cf6 28%,transparent);}
  .ai-kind-tag.desktop{color:#f59e0b;background:color-mix(in srgb,#f59e0b 12%,transparent);border-color:color-mix(in srgb,#f59e0b 28%,transparent);}
  .ai-card-actions{display:flex;gap:8px;margin-top:2px;}
  .ai-card-actions .btn{flex:1;justify-content:center;}
  .ai-note{font-size:11.5px;color:var(--txt-3);line-height:1.6;background:var(--bg-2);border-radius:8px;padding:8px 10px;border:1px dashed var(--line);}
  .ai-loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px;color:var(--txt-3);font-size:14px;}
  .ai-loading .sp{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ac);animation:spin .7s linear infinite;}
</style>

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  function isOnline(r){
    const isService = r.type==='web' || r.type==='web-service' || r.type==='port';
    const hasPort = !!r.port;
    if (isService || hasPort) return r.online || r.status==='online' || r.status==='running';
    return false; // 普通 GUI 应用不显示「运行中」，只显示「未启用」
  }

  async function api(path, method='GET', body){
    const opts = {method, headers:{'Content-Type':'application/json'}};
    if(body) opts.body = JSON.stringify(body);
    const res = await fetch(API_BASE+path, opts);
    if(!res.ok) throw new Error((await res.json()).reason || `HTTP ${res.status}`);
    return res.json();
  }

  function toast(msg, isErr){
    const t=document.getElementById('toast');
    t.textContent=msg; t.className=isErr?'err show':'show';

    state.toastTimer=setTimeout(()=>{t.className='';},2800);
  }

  function countByType(){
    const counts={};
    TABS.forEach(t=>counts[t.key]=0);
    state.resources.forEach(r=>{
      if(r.system && !state.showSystem) return; // 隐藏系统端口时不计入
      if(r.removed){ counts['__removed']++; return; }
      counts['全部']++;
      if(r.isNew) counts['__new']++;
      const tab=TABS.find(t=>t.types && t.types.includes(r.type));
      if(tab) counts[tab.key]++;
    });
    return counts;
  }

  function filteredResources(){
    let list=state.resources.slice();
    if(!state.showSystem) list=list.filter(r=>!r.system); // 默认隐藏系统端口，避免 Windows 内部服务刷屏
    if(state.filter!=='全部'){
      const tab=TABS.find(t=>t.key===state.filter);
      if(tab){
        if(tab.onlyNew) list=list.filter(r=>!r.removed && r.isNew);
        else if(tab.onlyRemoved) list=list.filter(r=>r.removed);
        else if(tab.types) list=list.filter(r=>tab.types.includes(r.type) && !r.removed);
      }
    } else {
      list=list.filter(r=>!r.removed);
    }
    const q=(state.mainQuery||'').trim().toLowerCase();
    if(q){
      list=list.filter(r=>
        (r.name||'').toLowerCase().includes(q) ||
        (r.path||'').toLowerCase().includes(q) ||
        (r.desc||'').toLowerCase().includes(q) ||
        (r.sourceApp||'').toLowerCase().includes(q)
      );
    }
    return list;
  }

  function groupsOf(list){
    const order=['app','web','web-service','port','mini-program','script','attachment','tool','file'];
    const byType={};
    list.forEach(r=>{(byType[r.type]=byType[r.type]||[]).push(r);});
    const out=[];
    order.forEach(t=>{
      const items=byType[t];
      if(!items||!items.length) return;
      if(t==='tool' || t==='script' || t==='attachment'){
        // 工具/脚本/附件按「实际功能分类」二次分组，避免同一类型卡片过多混在一起
        const byCat={};
        items.forEach(r=>{(byCat[r.category||'其他']=byCat[r.category||'其他']||[]).push(r);});
        Object.keys(byCat).sort((a,b)=>a.localeCompare(b,'zh-CN')).forEach(cat=>{
          out.push({type:t, label:kindLabel(t)+' · '+cat, items:byCat[cat]});
        });
      }else{
        out.push({type:t, label:kindLabel(t), items});
      }
    });
    Object.keys(byType).forEach(t=>{if(!order.includes(t)) out.push({type:t, label:kindLabel(t), items:byType[t]});});
    return out;
  }

  // 端口按来源进程名(sourceApp)聚合为可折叠分组
  function portGroupsByApp(ports){
    const map={};
    ports.forEach(p=>{
      const key=(p.sourceApp && p.sourceApp!=='(未知进程)') ? p.sourceApp : (p.name||'(未知进程)');
      (map[key]=map[key]||[]).push(p);
    });
    const arr=Object.keys(map).map(k=>({key:'app::'+k, label:k, items:map[k]}));
    // 多端口进程排前面，便于一眼看到聚合效果；同数量按名称排序保证稳定
    arr.sort((a,b)=> b.items.length-a.items.length || a.label.localeCompare(b.label));
    return arr;
  }

  function renderOverview(){

  // ---- 概括页常开：系统监控(8801) + 仪表盘(8802) 迷你实时卡 ----
  function renderSysmonMini(){
    return `<div class="bento-card overview-card sysmon-mini-card" id="sysmonMiniCard">
      <div class="bento-head"><span class="bh-ico" style="background:linear-gradient(135deg,#3b82f6,#06b6d4);">${ICONS.cpu}</span><h3>系统监控</h3><button class="ov-refresh" data-action="refreshSysmon" title="刷新" type="button">${ICONS.refresh}</button><span class="ov-live" id="sysmonMiniLive">未刷新</span></div>

  function renderDashMini(){

    </div>`;

  function ovRow(label,value,wrap,pct,sub){
    const bar = (typeof pct==='number') ? (()=>{ const p=Math.max(0,Math.min(100,pct)); const c=usageColor(p); return `<div class="ov-bar"><i style="width:${p}%;background:${c};"></i></div>`; })() : '';
    const subHtml = sub ? `<div class="ov-sub">${esc(sub)}</div>` : '';
    const valCls = wrap ? 'ov-val wrap' : 'ov-val';
    const valColor = (typeof pct==='number') ? usageColor(pct) : 'var(--ink)';
    return `<div class="ov-row"><span class="ov-k">${esc(label)}</span><span class="${valCls}" style="color:${valColor};">${esc(value)}</span></div>${bar}${subHtml}`;
  }
  function sysmonMiniHTML(info,disk,proxy){
    const rows=[];
    rows.push(ovRow('主机名', info?info.hostname:'--'));
    rows.push(ovRow('运行时长', info?info.uptime:'--'));
    rows.push(ovRow('CPU', info?info.cpu:'--', true));
    const mem = info&&info.mem;
    if(mem) rows.push(ovRow('内存', fmtPct(mem.usedPct), false, mem.usedPct, fmtGB(mem.usedGB)+' / '+fmtGB(mem.totalGB)));
    (disk&&disk.disks||[]).forEach(d=>{
      rows.push(ovRow(d.Name+' 盘', fmtPct(d.UsedPct||0), false, d.UsedPct, fmtGB(d.UsedGB)+' / '+fmtGB(d.TotalGB)));
    });
    const proxyTxt = proxy&&proxy.enabled ? ('已启用 · '+(proxy.proxyServer||'')) : '未启用';
    rows.push(ovRow('系统代理', proxyTxt));
    return '<div class="ov-rows">'+rows.join('')+'</div>';
  }
  function dashMiniHTML(quick,disks){
    const rows=[];
    rows.push(ovRow('系统', quick&&quick.platform ? quick.platform : '--'));
    rows.push(ovRow('运行时长', quick ? fmtUptime(quick.uptime) : '--'));
    if(quick&&quick.cpus) rows.push(ovRow('CPU', quick.cpus.count+' 核 · '+(quick.cpus.model||''), true));
    const mem = quick&&quick.memory;
    if(mem){
      const pct = Number(mem.percent)||0;
      const usedGB = mem.used/(1024*1024*1024), totalGB = mem.total/(1024*1024*1024);
      rows.push(ovRow('内存', fmtPct(pct), false, pct, fmtGB(usedGB)+' / '+fmtGB(totalGB)));
    }
    (disks&&disks.disks||[]).forEach(d=>{
      const pct = d.totalBytes ? (d.usedBytes/d.totalBytes*100) : 0;
      const usedGB = d.usedBytes/(1024*1024*1024), totalGB = d.totalBytes/(1024*1024*1024);
      rows.push(ovRow(d.drive, fmtPct(pct), false, pct, fmtGB(usedGB)+' / '+fmtGB(totalGB)));
    });
    return '<div class="ov-rows">'+rows.join('')+'</div>';
  }
  // 概览页迷你监控卡：改为手动刷新（默认不轮询），避免后台高频请求导致视觉抖动或暂时不可达
  const ovFetch=(base,path)=>{
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),6000);
    const headers={};
    if(window.__TB_TOKEN__) headers['X-Access-Token']=window.__TB_TOKEN__;
    return fetch(base+path,{signal:ctrl.signal,method:'GET',headers})
      .then(r=>{ clearTimeout(to); return r.ok ? r.json() : null; })
      .catch(e=>{ clearTimeout(to); return null; });
  };
  function overviewMonitorTick(kind){
    if(state.ovRefreshing) return;
    state.ovRefreshing=true;
    const spin = (sel)=>{ const b=document.querySelector(sel); if(b) b.classList.add('spin'); };
    const unspin = (sel)=>{ const b=document.querySelector(sel); if(b) b.classList.remove('spin'); };
    const sysmon = async()=>{
      spin('#sysmonMiniCard .ov-refresh');
      const live=document.getElementById('sysmonMiniLive'); if(live){ live.className='ov-live'; live.textContent='更新中…'; }
      try{
        const [info,disk,proxy]=await Promise.all([
          ovFetch('','/api/system/info'),
          ovFetch('','/api/system/disk'),
          ovFetch('','/api/system/proxy/status')
        ]);
        const smBody=document.getElementById('sysmonMiniBody');
        if(smBody){
          if(info||disk||proxy){ smBody.innerHTML=sysmonMiniHTML(info,disk,proxy); if(live){ live.className='ov-live ok'; live.textContent='已更新'; } }
          else { smBody.innerHTML='<div class="ov-muted">系统监控服务未运行<br><button class="btn btn-ghost btn-sm" data-action="refreshSysmon" type="button">重试</button></div>'; if(live){ live.className='ov-live bad'; live.textContent='未运行'; } }
        }
      }catch(e){ const smBody=document.getElementById('sysmonMiniBody'); if(smBody) smBody.innerHTML='<div class="ov-muted">读取失败<br><button class="btn btn-ghost btn-sm" data-action="refreshSysmon" type="button">重试</button></div>'; if(live){ live.className='ov-live bad'; live.textContent='失败'; } }
      finally{ unspin('#sysmonMiniCard .ov-refresh'); }
    };
    const dash = async()=>{
      spin('#dashMiniCard .ov-refresh');
      const live=document.getElementById('dashMiniLive'); if(live){ live.className='ov-live'; live.textContent='更新中…'; }
      try{
        const [quick,disks]=await Promise.all([
          ovFetch('','/api/tools/monitor/quick'),
          ovFetch('','/api/tools/monitor/disks')
        ]);
        const dBody=document.getElementById('dashMiniBody');
        if(dBody){
          if(quick||disks){ dBody.innerHTML=dashMiniHTML(quick,disks); if(live){ live.className='ov-live ok'; live.textContent='已更新'; } }
          else { dBody.innerHTML='<div class="ov-muted">仪表盘服务未运行<br><button class="btn btn-ghost btn-sm" data-action="refreshDash" type="button">重试</button></div>'; if(live){ live.className='ov-live bad'; live.textContent='未运行'; } }
        }
      }catch(e){ const dBody=document.getElementById('dashMiniBody'); if(dBody) dBody.innerHTML='<div class="ov-muted">读取失败<br><button class="btn btn-ghost btn-sm" data-action="refreshDash" type="button">重试</button></div>'; if(live){ live.className='ov-live bad'; live.textContent='失败'; } }
      finally{ unspin('#dashMiniCard .ov-refresh'); }
    };
    const all = async()=>{ await Promise.all([sysmon(),dash()]); state.ovRefreshing=false; };
    if(kind==='sysmon') sysmon().finally(()=>state.ovRefreshing=false);
    else if(kind==='dash') dash().finally(()=>state.ovRefreshing=false);
    else all();
  }

  function renderStats(counts,runningCount){
    const stat=(icon,color,value,label)=>`<div class="stat-card"><div class="stat-ico" style="background:${color};">${icon}</div><div class="stat-main"><div class="stat-value">${value}</div><div class="stat-label">${label}</div></div></div>`;

  function usageColor(p){ return p>=90?'var(--danger)':(p>=75?'var(--warn)':'var(--ok)'); }
  function renderSystemStatus(){
    const m=state.metrics;

      return `<div class="sys-item">

      html='<div class="sys-item"><div class="sys-top"><span class="sys-ico">'+ICONS.cpu+'</span><span class="sys-label">系统状态</span><span class="sys-value">--</span></div><div class="sys-sub">正在读取…</div></div>';

      html = item(ICONS.cpu,'CPU',fmtPct(m.cpu),m.cpu,'')
           + item(ICONS.memory,'内存',fmtPct(m.memPct),m.memPct,fmtGB(m.memUsed)+' / '+fmtGB(m.memTotal))
           + item(ICONS.disk,'C 盘',fmtPct(m.diskCPct),m.diskCPct,fmtGB(m.diskCUsed)+' / '+fmtGB(m.diskCTotal))
           + item(ICONS.disk,'D 盘',fmtPct(m.diskDPct),m.diskDPct,fmtGB(m.diskDUsed)+' / '+fmtGB(m.diskDTotal));

  function fmtUptimeSec(s){
    if(!s && s!==0) return '--';
    const d=Math.floor(s/86400), h=Math.floor((s%86400)/3600), mi=Math.floor((s%3600)/60), se=s%60;
    if(d>0) return `${d} 天 ${h.toString().padStart(2,'0')}:${mi.toString().padStart(2,'0')}:${se.toString().padStart(2,'0')}`;
    return `${h.toString().padStart(2,'0')}:${mi.toString().padStart(2,'0')}:${se.toString().padStart(2,'0')}`;
  }

  function renderClockCard(){
    const now = new Date();
    const pad=n=>String(n).padStart(2,'0');
    const time = pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
    const date = now.getFullYear()+'/'+(now.getMonth()+1)+'/'+now.getDate();
    const week = '周'+'日一二三四五六'[now.getDay()];
    return `<div class="bento-card overview-card clock-card">
      <div class="bento-head"><span class="bh-ico" style="background:linear-gradient(135deg,#8b5cf6,#d946ef);">${ICONS.clock}</span><h3>本地时间</h3><span class="clock-week">${week}</span></div>
      <div class="clock-time" id="clockTime">${time}</div>
      <div class="clock-date" id="clockDate">${date}</div>
      ${renderMiniCalendar(now)}
    </div>`;
  }
  function renderMiniCalendar(now){
    const y=now.getFullYear(), m=now.getMonth();
    const first=new Date(y,m,1), last=new Date(y,m+1,0);
    const startDay=first.getDay();
    const days=[];
    for(let i=0;i<startDay;i++) days.push('<span></span>');
    for(let d=1;d<=last.getDate();d++){
      const cls=(d===now.getDate())?' today':'';
      days.push(`<span class="cal-day${cls}">${d}</span>`);
    }
    return `<div class="mini-cal"><div class="cal-head">日</div><div class="cal-head">一</div><div class="cal-head">二</div><div class="cal-head">三</div><div class="cal-head">四</div><div class="cal-head">五</div><div class="cal-head">六</div>${days.join('')}</div>`;
  }

  function statusTagHTML(r){
    if(r.removed) return '<span class="tag tag-offline">已删除</span>';
    if(isOnline(r)) return '<span class="tag tag-online">运行中</span>';
    if(r.status==='missing' || r.status==='uwp') return '<span class="tag tag-offline">未安装</span>';
    return '<span class="tag tag-offline">未启用</span>';
  }
  function launchLabel(r){
    const online=isOnline(r);
    if(r.removed) return '已删除';
    if(r.type==='script') return '运行';
    if(r.type==='tool') return '启动';
    if(r.type==='file') return (r.fileKind==='executable')?'启动':'打开';
    if(r.type==='web'||r.type==='web-service'||r.type==='port') return online?'打开':'启动服务';
    return online?'启动':'启动';
  }

    const statusDot = online ? '<span class="c-status-dot online" title="运行中"></span>' : '<span class="c-status-dot"></span>';

    };

  async function doLaunch(id){
    try{
      const result=await api('/api/launch','POST',{id});
      if(!result.ok){ toast('启动失败：'+result.reason, true); return; }
      const r=state.resources.find(x=>x.id===id);
      const title=r?r.name:'';
      if(result.mode==='embed' && result.url){
        showEmbed(id, result.url, title);
      }else if(result.mode==='start' && result.url){
        toast(result.note||'正在启动服务…');
        await waitForService(result.url, title, id);
      }else{
        toast('已启动：'+result.target);
      }
    }catch(e){toast('启动失败：'+e.message, true);}
  }

  // 轮询探测 URL 是否可用，真正可用后再嵌入，避免服务还没起来就显示拒绝连接
  async function waitForService(url, title, id){
    const maxMs = 30000, interval = 800;
    const started = Date.now();
    // 先给 exe 一个最小启动时间
    await new Promise(r=>setTimeout(r, 1200));
    while (Date.now() - started < maxMs) {
      try {
        const ok = await probeUrl(url);
        if (ok) { showEmbed(id, url, title); loadResources(true); return; }
      } catch (e) {}
      await new Promise(r=>setTimeout(r, interval));
    }
    // 超时仍打开，但提示用户可能还在启动
    showEmbed(id, url, title);
    toast('服务启动较慢，已在右侧打开，若仍拒绝连接请稍候刷新', true);
  }

  function probeUrl(url){
    return new Promise(resolve=>{
      fetch(url, { method: 'HEAD', mode: 'no-cors', cache: 'no-store' })
        .then(()=> resolve(true))
        .catch(()=> resolve(false));
    });
  }

  async function doOpen(id){
    try{
      await api('/api/open','POST',{id});
      toast('已打开所在位置');
    }catch(e){toast('打开失败：'+e.message, true);}

  async function doStop(id){
    try{
      const result=await api('/api/stop','POST',{id});
      if(result.ok){
        toast('已发送停止指令');
        // 服务停止+端口释放需要时间，轮询刷新直到状态落地
        setTimeout(()=>loadResources(true), 400);
        setTimeout(()=>loadResources(true), 1200);
        setTimeout(()=>loadResources(true), 2500);
        setTimeout(()=>loadResources(true), 4500);
      }else{
        toast(result.reason||'关闭失败', true);
      }
    }catch(e){toast('关闭失败：'+e.message, true);}
  }

  function fmtTime(iso){
    if(!iso) return '';
    const d=new Date(iso);
    return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  }

  // ---------------- 通用运行面板（脚本执行 / 端口探测） ----------------
  function scriptCommandFor(r){
    const p = r.path || '';
    const ext = (p.match(/\.[^.]+$/)||[''])[0].toLowerCase();
    if(ext==='.bat'||ext==='.cmd') return `cmd /c "${p}"`;
    if(ext==='.ps1') return `powershell -ExecutionPolicy Bypass -File "${p}"`;
    if(ext==='.py') return `python "${p}"`;
    if(ext==='.js') return `node "${p}"`;
    if(ext==='.exe') return `"${p}"`;
    return p;
  }
  function isRunnableScript(r){
    const p = r.path || '';
    if(r.type==='script') return true;
    if(r.type==='file' || r.type==='tool') return /\.(bat|cmd|ps1|py|js|exe)$/i.test(p);
    return false;
  }
  async function runOnce(id){
    const r=state.resources.find(x=>x.id===id);
    if(!r) return;
    state.runOutputs[id] = { loading: true };
    if(state.selectedId===id) renderDetail();
    try{
      const result = await api('/api/run-once','POST',{id});
      state.runOutputs[id] = result;
    }catch(e){
      state.runOutputs[id] = { ok:false, reason:e.message, output:'', exitCode:null, durationMs:0 };
    }
    if(state.selectedId===id) renderDetail();
  }
  async function probePortOnce(port){
    state.probeResults[port] = { loading: true };
    if(state.selectedId){ const r=state.resources.find(x=>x.id===state.selectedId); if(r && r.port===port) renderDetail(); }
    try{
      const result = await api('/api/probe-port?port='+encodeURIComponent(port),'GET');
      state.probeResults[port] = result;
    }catch(e){
      state.probeResults[port] = { ok:false, online:false, reason:e.message };
    }
    if(state.selectedId){ const r=state.resources.find(x=>x.id===state.selectedId); if(r && r.port===port) renderDetail(); }
  }
  function renderRunPanel(r){
    if(r.removed) return '';
    if(isRunnableScript(r)){
      const rec = state.runOutputs[r.id] || null;
      let outputHtml = '<div class="run-empty">点击「执行一次」查看输出</div>';
      if(rec && rec.loading) outputHtml = '<div class="run-empty">正在执行…</div>';
      else if(rec){
        const head = rec.ok
          ? `<span style="color:var(--ok)">退出码 0</span> · ${rec.durationMs||0} ms`
          : `<span style="color:var(--danger)">${esc(rec.exitCode!=null?'退出码 '+rec.exitCode:'执行失败')}</span> · ${esc(rec.reason||'')}`;
        const body = esc(rec.output || '');
        outputHtml = `<div style="margin-bottom:8px;font-size:12px;color:var(--txt-3)">${head}</div><pre class="run-output">${body}</pre>`;
      }
      return `<div class="panel run-panel">
        <div class="rp-head"><h4>${ICONS.script}通用运行面板</h4><span class="rp-meta">${esc(scriptCommandFor(r))}</span></div>
        <p style="margin:0 0 12px;font-size:13px;color:var(--txt-2);">无需专属 UI，直接执行一次脚本并查看输出（超时 30 秒自动停止）。</p>
        <div style="display:flex;gap:8px;margin-bottom:10px;">
          <button class="btn btn-primary btn-sm" data-action="runOnce" data-id="${esc(r.id)}" type="button">${ICONS.play}执行一次</button>
          <button class="btn btn-ghost btn-sm" data-action="open" data-id="${esc(r.id)}" type="button">${ICONS.folder}打开目录</button>
        </div>
        <div id="runOutput-${esc(r.id)}">${outputHtml}</div>
      </div>`;
    }
    if(r.type==='port'){
      const rec = state.probeResults[r.port] || null;
      let statusHtml = '<span class="probe-status">点击探测查看端口状态</span>';
      if(rec && rec.loading) statusHtml = '<span class="probe-status">探测中…</span>';
      else if(rec) statusHtml = rec.online
        ? `<span class="probe-status ok">● 端口 ${esc(r.port)} 可达</span>`
        : `<span class="probe-status bad">端口 ${esc(r.port)} 不可达</span>`;
      return `<div class="panel run-panel">
        <div class="rp-head"><h4>${ICONS.port}端口探测</h4></div>
        <p style="margin:0 0 12px;font-size:13px;color:var(--txt-2);">该端口没有专属 Web 界面时，可用此面板确认服务是否真的在监听。</p>
        <div class="probe-row">
          <button class="btn btn-primary btn-sm" data-action="probePort" data-port="${esc(r.port)}" type="button">${ICONS.play}探测端口</button>
          ${statusHtml}
        </div>
      </div>`;
    }
    return '';
  }

  async function saveResource(editId){
    const form=document.getElementById('resForm');
    if(!form) return;
    const fd=new FormData(form);
    const obj={}; fd.forEach((v,k)=>{ obj[k]=v; });
    if(editId){ obj.id=editId; }
    obj.manual=true;
    if(obj.port){ obj.port=parseInt(obj.port,10)||''; }
    if(!obj.name || !obj.name.trim()){ toast('请填写名称',true); return; }
    if(!obj.type){ toast('请选择类型',true); return; }
    const saveBtn=document.getElementById('modalSave');
    if(saveBtn){ saveBtn.classList.add('is-loading'); saveBtn.disabled=true; }
    try{
      await api('/api/resource','POST',obj);
      closeModal();
      await loadResources(true);
      toast(editId?'已保存修改':'已添加资产：'+obj.name);
    }catch(e){
      toast('保存失败：'+e.message,true);
      if(saveBtn){ saveBtn.classList.remove('is-loading'); saveBtn.disabled=false; }
    }
  }

          <button class="stab" data-stab="hotkeys">快捷键</button>
          <button class="stab" data-stab="tools">内置工具</button>
          <button class="stab" data-stab="data">数据</button>

  function onSettingsAction(e){
    const el=e.target.closest('[data-action]'); if(!el) return;
    const a=el.dataset.action; const s=state.settings;
    if(a==='setTheme'){ s.theme=el.dataset.theme; persistSettings(); refreshSettingsTab(); }
    else if(a==='toggleAutoscan'){ s.autoScan=!s.autoScan; el.classList.toggle('on', s.autoScan); persistSettings(); }
    else if(a==='clearBg'){ s.bgColor=''; persistSettings(); const c=document.getElementById('setBgColor'); if(c) c.value='#0d1117'; }
    else if(a==='clearCache'){ try{ localStorage.removeItem('jct.thumb'); }catch(e){} toast('缓存已清理'); }
    else if(a==='exportConfig'){ const blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}); const u=URL.createObjectURL(blob); const a2=document.createElement('a'); a2.href=u; a2.download='juchuangtai-settings.json'; a2.click(); URL.revokeObjectURL(u); }
    else if(a==='importConfig'){ const f=document.getElementById('importFile'); if(f) f.click(); }
    else if(a==='resetSettings'){ if(confirm('确定恢复默认设置？')){ state.settings=Object.assign({},DEFAULT_SETTINGS); persistSettings(); refreshSettingsTab(); toast('已恢复默认设置'); } }
    else if(a==='saveToken'){ const inp=document.getElementById('setToken'); const v=inp?inp.value.trim():''; try{ localStorage.setItem('jct_token', v); }catch(e){} window.__TB_TOKEN__=v; const h=document.getElementById('tokenHint'); if(h) h.textContent = v? '已保存，后续请求将携带令牌' : '已清空（服务器不校验）'; toast(v?'访问令牌已保存':'访问令牌已清空'); }
    else if(a==='refreshSec'){ fetchSecStatus(); }
    else if(a==='refreshStatus'){ fetchStatus(); }
    else if(a==='openDiscover'){ openDiscover(); }
  }
  function onSettingsInput(e){
    if(e.target.id==='setBrightness'){ const v=parseFloat(e.target.value); state.settings.brightness=v; const lab=document.getElementById('setBrightnessVal'); if(lab) lab.textContent=Math.round(v*100)+'%'; persistSettings(); }
  }
  function onSettingsChange(e){
    const s=state.settings;
    if(e.target.id==='setFont'){ s.fontFamily=e.target.value; persistSettings(); }
    else if(e.target.id==='setBgColor'){ s.bgColor=e.target.value; persistSettings(); }
    else if(e.target.id==='setStartup'){ s.startupPage=e.target.value; persistSettings(); }
    else if(e.target.id==='setToolsScale'){ s.toolsScale=parseInt(e.target.value,10); persistSettings(); }
    else if(e.target.id==='importFile'){ const file=e.target.files[0]; if(!file) return; const rd=new FileReader(); rd.onload=()=>{ try{ const o=JSON.parse(rd.result); state.settings=Object.assign({},DEFAULT_SETTINGS,o); persistSettings(); refreshSettingsTab(); toast('设置已导入'); }catch(err){ toast('导入失败：JSON 解析错误', true); } }; rd.readAsText(file); }
  }

      el.innerHTML = row('CORS 同源策略', true) + row('CSP 响应头', s.csp) + row('文件根校验', s.fileGuard) + row('SSRF 防护', s.ssrfGuard) + row('访问令牌', s.tokenEnabled)
        + `<div class="set-row"><label>绑定地址</label><span style="color:#7aa2f7">${esc(s.host)}</span></div>`
        + `<div class="set-row"><label>传输层</label><span style="color:${s.https?'#5ee0a0':'#c2740a'}">${s.https?'HTTPS':'HTTP（明文，跨机暴露建议加 TLS）'}</span></div>`;
    }catch(e){ el.innerHTML='<span style="color:#c2740a">获取失败：'+(e&&e.message?e.message:e)+'</span>'; }

  async function fetchStatus(){
    const el=document.getElementById('runStatus'); if(!el) return;
    try{
      const s=await api('/api/status');
      const row=(k,v)=>`<div class="set-row"><label>${k}</label><span style="color:#9fb0c3;font-weight:600">${v}</span></div>`;
      const fmtUptime=sec=>{ if(!sec) return '0 分'; const m=Math.floor(sec/60),h=Math.floor(m/60),d=Math.floor(h/24); if(d>0) return d+' 天 '+(h%24)+' 时'; if(h>0) return h+' 时 '+(m%60)+' 分'; return m+' 分'; };
      el.innerHTML = row('服务名称', esc(s.name||'')) + row('版本', 'v'+esc(s.version||'')) + row('绑定', esc(s.host||'')+':'+(s.port||''))
        + row('运行时长', fmtUptime(s.uptimeSec)) + row('挂载工具路由', s.mountedTools+' 个') + row('自托管', s.selfService?'已启用':'未启用')
        + row('CORS', s.cors) + row('CSP', s.csp?'已启用':'未启用') + row('文件守卫', s.fileGuard?'已启用':'未启用') + row('SSRF 守卫', s.ssrfGuard?'已启用':'未启用') + row('访问令牌', s.tokenEnabled?'已启用':'未启用(本机无感)');
    }catch(e){ el.innerHTML='<span style="color:#c2740a">获取失败：'+(e&&e.message?e.message:e)+'</span>'; }
  }

  // ---------------- 本地能力发现向导 ----------------
  function cKey(c){ return [c.name||'', c.port||'', c.url||'', c.path||''].join('|'); }
  function shortPath(p){ if(!p) return ''; const parts=p.split(/[\\/]/); return parts[parts.length-1]; }
  async function openDiscover(){
    const root=document.getElementById('modalRoot');
    root.innerHTML='<div class="modal-mask" id="modalMask"><div class="modal discover-modal" role="dialog" aria-modal="true">'
      + '<div class="modal-head"><h3>发现本机能力</h3><button class="btn btn-icon btn-ghost btn-sm" id="modalClose" type="button" aria-label="关闭">'+CLOSE_SVG+'</button></div>'
      + '<div class="modal-body" id="discoverBody"><div class="loading" style="padding:18px;text-align:center;color:var(--txt-3)">正在扫描本机端口与目录…</div></div>'
      + '<div class="modal-foot"><button class="btn btn-ghost" id="modalCancel" type="button">关闭</button><button class="btn btn-primary" id="discoverAddAll" type="button" disabled>全部添加</button></div>'
      + '</div></div>';

  async function runDiscover(){
    const el=document.getElementById('discoverBody'); if(!el) return;
    try{
      const data=await api('/api/discover');
      state._discover=(data.candidates||[]);
      renderDiscover();
    }catch(e){
      el.innerHTML='<div class="disc-empty" style="color:#c2740a">扫描失败：'+(e&&e.message?e.message:e)+'</div>';
    }
  }
  function renderDiscover(){
    const el=document.getElementById('discoverBody'); if(!el) return;
    const list=state._discover||[];
    const addAllBtn=document.getElementById('discoverAddAll');
    if(!list.length){ el.innerHTML='<div class="disc-empty">未发现可纳入管理的新能力。本机已登记，或无可识别的端口 / 应用 / 可执行文件。</div>'; if(addAllBtn) addAllBtn.disabled=true; return; }
    const srcMap={aiApp:'config AI 应用', port:'常见端口', exe:'目录扫描'};
    const rows=list.map(function(c){
      const k=cKey(c);
      const added=state._discoverAdded.has(k);
      const meta=c.url?c.url:(c.port?('端口 '+c.port):(c.path?shortPath(c.path)+' · '+c.path:''));
      const src=srcMap[c.source]||c.source||'';
      return '<div class="disc-row">'
        + '<div class="disc-main"><div class="disc-name">'+esc(c.name||'')+'</div><div class="disc-meta">'+esc(c.category||'')+(meta?(' · '+esc(meta)):'')+'</div></div>'
        + '<div class="disc-tag">'+esc(src)+'</div>'
        + '<button class="btn btn-sm '+(added?'btn-ghost':'btn-primary')+'" data-action="'+(added?'added':'addCandidate')+'" data-ckey="'+esc(k)+'" '+(added?'disabled':'')+'>'+(added?'已添加':'添加')+'</button>'
        + '</div>';
    }).join('');
    el.innerHTML='<p class="set-hint" style="margin:0 0 10px">共发现 '+list.length+' 项可纳入管理的本机能力：</p><div class="disc-list">'+rows+'</div>';
    const allAdded=list.every(function(c){ return state._discoverAdded.has(cKey(c)); });
    if(addAllBtn) addAllBtn.disabled=allAdded;
  }
  function onDiscoverBodyClick(e){
    const btn=e.target.closest('[data-action]'); if(!btn) return;
    if(btn.dataset.action==='addCandidate'){ addCandidate(btn.dataset.ckey); }
  }
  async function addCandidate(ckey){
    const c=(state._discover||[]).find(function(x){ return cKey(x)===ckey; }); if(!c) return;
    try{
      const obj=Object.assign({}, c); delete obj.online;
      await api('/api/resource','POST',obj);
      state._discoverAdded.add(ckey);
      toast('已添加：'+(c.name||''));
      renderDiscover();
      await loadResources(true);

  async function addAllCandidates(){

      const k=cKey(c);
      if(state._discoverAdded.has(k)) continue;
      try{
        const obj=Object.assign({}, c); delete obj.online;
        await api('/api/resource','POST',obj);
        state._discoverAdded.add(k); n++;
      }catch(e){ /* 跳过单项失败 */ }
    }

    await loadResources(true);

  async function sendAssistant(){
    var inp=document.getElementById('assistantInput'); if(!inp) return;
    var text=inp.value.trim(); if(!text) return;
    if(!state.assistMsgs) state.assistMsgs=[];
    state.assistMsgs.push({ role:'user', content:text });

    var loading=document.createElement('div'); loading.className='ass-msg bot'; loading.innerHTML='<span class="ass-spin"></span> 思考中…';
    box.appendChild(loading); box.scrollTop=box.scrollHeight;
    var cfg=loadAssistCfg();
    try{
      var r=await api('/api/assistant/chat','POST',{ messages: state.assistMsgs.map(function(m){ return { role:m.role, content:m.content }; }), provider: cfg.provider, baseUrl: cfg.baseUrl, model: cfg.model });
      if(loading.parentNode) box.removeChild(loading);
      if(r && r.ok){ state.assistMsgs.push({ role:'bot', content: r.reply }); }
      else { state.assistMsgs.push({ role:'bot', content: (r&&r.reason)||'暂时无法回答' }); }

      if(loading.parentNode) box.removeChild(loading);

  async function saveSettings(){
    const roots=document.getElementById('cfgRoots').value.split('\n').map(x=>x.trim()).filter(Boolean);
    const froots=document.getElementById('cfgFRoots').value.split('\n').map(x=>x.trim()).filter(Boolean);
    const svc={};
    document.getElementById('cfgSvc').value.split('\n').forEach(line=>{
      const t=line.trim(); if(!t) return;
      const i=t.indexOf('=');
      if(i>0){ const p=t.slice(0,i).trim(); const n=t.slice(i+1).trim(); if(p && /^\d+$/.test(p)) svc[p]=n; }
    });
    // 内置工具配置
    const btWKey=(document.getElementById('btWKey')||{}).value.trim();
    const btWApi=(document.getElementById('btWApi')||{}).value.trim();
    const btWBalance=(document.getElementById('btWBalance')||{}).value.trim();
    const btWModel=(document.getElementById('btWModel')||{}).value.trim();
    const btMSource=(document.getElementById('btMSource')||{}).value;
    const btMApi=(document.getElementById('btMApi')||{}).value.trim();
    const btMCookie=(document.getElementById('btMCookie')||{}).value.trim();
    const btOllama=(document.getElementById('btOllama')||{}).value.trim();
    const builtinTools={
      writing:{ apiKey:btWKey, api:btWApi||'https://api.deepseek.com/v1/chat/completions', balanceApi:btWBalance||'https://api.deepseek.com/user/balance', model:btWModel||'deepseek-chat' },
      music:{ apiUrl:btMApi, source:btMSource||'tencent', cookie:btMCookie }
    };
    // 保留既有 portScan.serviceStart（避免保存时清空 Ollama / free-API 等启动命令），并写入 Ollama 启动命令
    const basePortScan = (window._cfgFull && window._cfgFull.portScan) || {};
    const portScan = { knownServices: svc, serviceStart: Object.assign({}, basePortScan.serviceStart||{}, { Ollama: btOllama }) };
    const payload={ monitoredRoots:roots, fileScanRoots:froots, portScan, builtinTools };
    persistSettings();
    const saveBtn=document.getElementById('modalSave');
    saveBtn.classList.add('is-loading'); saveBtn.disabled=true;
    try{
      await api('/api/config','POST',payload);

      await doScan();

      toast('保存失败：'+e.message,true);

    }

      else if(m.cpu>80 || m.diskCPct>85 || m.memPct>85){ health='warn'; healthText='偏高'; }

    const cText=m?fmtPct(m.diskCPct):'--';

  function rotateBgIfNeeded(){

  function initLandingParticles(){
    const c=document.getElementById('landingParticles'); if(!c) return;
    const ctx=c.getContext('2d');
    let w,h,particles=[];
    const resize=()=>{ w=c.width=c.offsetWidth; h=c.height=c.offsetHeight; };
    resize();
    window.addEventListener('resize',resize);
    for(let i=0;i<48;i++) particles.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+1,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,o:Math.random()*.5+.2});
    function frame(){
      ctx.clearRect(0,0,w,h);
      particles.forEach(p=>{
        p.x+=p.vx; p.y+=p.vy;
        if(p.x<0||p.x>w) p.vx*=-1;
        if(p.y<0||p.y>h) p.vy*=-1;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,'+p.o+')'; ctx.fill();
      });
      requestAnimationFrame(frame);
    }
    frame();
  }
  function startTick(){
    if(state._tickTimer) return;
    initLandingParticles();
    let tick=0;
    state._tickTimer=setInterval(()=>{
      tick++;
      const now=new Date();
      const pad=n=>String(n).padStart(2,'0');
      const timeStr=pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
      const dateStr=now.getFullYear()+'/'+(now.getMonth()+1)+'/'+now.getDate();
      const tEl=document.getElementById('clockTime'); if(tEl) tEl.textContent=timeStr;
      const dEl=document.getElementById('clockDate'); if(dEl) dEl.textContent=dateStr;
      const lc=document.getElementById('landingClock'); if(lc) lc.textContent=timeStr;
      const ld=document.getElementById('landingDate'); if(ld) ld.textContent=dateStr;
      const upEl=document.getElementById('selfUptime');
      if(upEl && state.self.status && state.self.status.uptimeSec){
        const s=state.self.status.uptimeSec + Math.floor((Date.now()-(state.self._uptimeAt||Date.now()))/1000);
        upEl.textContent=fmtUptimeSec(s);
      }
      // 概览页指标与运行态不再后台自动刷新：由用户手动点击刷新按钮触发（阿豪 2026-09-06 明确要求）
      // 仅保留时钟、本地运行时长估算、背景轮播
      if(tick%30===0){
        state._bgIndex=(state._bgIndex+1)%BG_IMAGES.length;
        rotateBgIfNeeded();
      }
    },1000);
  }

    try{
      const [a, s] = await Promise.all([
        api('/api/ai-apps'),
        api('/api/ai-apps/status').catch(()=>({status:[]}))
      ]);
      state.aiApps = a.apps || [];
      state.aiStatus = {};
      (s.status||[]).forEach(x=>{ state.aiStatus[x.id] = x; });
    }catch(e){ state.aiApps = []; state.aiStatus = {}; toast('AI 应用加载失败：'+e.message, true); }
  }
  function renderAiApps(){
    const body=document.getElementById('contentBody');
    if(!body) return;
    body.classList.remove('tool-mode','files-mode');
    if(!state.aiApps || !state.aiApps.length){
      body.innerHTML='<div class="ai-loading"><span class="sp"></span>正在加载 AI 应用清单…</div>';
      loadAiApps().then(()=>{ if(state.section==='ai-apps') renderAiApps(); });
      return;
    }
    const apps=state.aiApps;
    const statusOf=id=>state.aiStatus[id]||{online:false};
    const onlineCount=apps.filter(a=>statusOf(a.id).online).length;
    const groups={};
    apps.forEach(a=>{ const g=a.group||'其他'; (groups[g]=groups[g]||[]).push(a); });
    const kindLabel={ web:'Web 内嵌', service:'本地服务', desktop:'桌面客户端' };
    const gridHtml=Object.keys(groups).map(g=>{
      const cards=groups[g].map(a=>{
        const st=statusOf(a.id);
        const dot=st.online?'on':'off';
        const canEmbed=a.embed && a.url;
        const actions=[];
        if(canEmbed) actions.push(`<button class="btn btn-primary btn-sm" data-action="aiEmbed" data-id="${esc(a.id)}" data-url="${esc(a.url)}" data-name="${esc(a.name)}">${ICONS.open}内嵌打开</button>`);
        if(a.url) actions.push(`<button class="btn btn-ghost btn-sm" data-action="aiExternal" data-url="${esc(a.url)}">浏览器</button>`);
        if(a.kind==='service') actions.push(`<button class="btn btn-ghost btn-sm" data-action="aiLaunch" data-id="${esc(a.id)}">启动</button>`);
        let note='';
        if(a.kind==='desktop') note='<div class="ai-note">本地桌面客户端 · 本工作台仅展示状态，请在系统中打开该应用</div>';
        else if(!st.online) note=`<div class="ai-note">当前离线${a.url?'，点击「内嵌打开」将尝试连接':'，暂无可用地址'}</div>`;
        return `<div class="ai-card">
          <div class="ai-card-top">
            <div class="ai-card-icon">${aiIcon(a.icon)}</div>
            <div class="ai-card-title"><div class="t-name">${esc(a.name)}<span class="ai-dot ${dot}" title="${st.online?'在线':'离线'}"></span></div><div class="t-desc">${esc(a.desc||'')}</div></div>
          </div>
          <div><span class="ai-kind-tag ${esc(a.kind)}">${kindLabel[a.kind]||a.kind}</span></div>
          ${note}
          <div class="ai-card-actions">${actions.join('')||'<span class="ai-note">暂无可执行操作</span>'}</div>
        </div>`;
      }).join('');
      return `<div class="ai-group"><div class="ai-group-title">${esc(g)}</div><div class="ai-grid">${cards}</div></div>`;
    }).join('');
    body.innerHTML=`<div class="ai-head"><div><h1>AI 应用工作台</h1><p>聚创台统一接入的本地 AI 客户端、服务与网关 · 点击卡片可内嵌到工作台内使用</p></div>
      <div class="ai-head-actions"><button class="btn btn-ghost" data-action="aiRefresh" type="button">${ICONS.refresh}刷新状态</button></div></div>
      <div class="ai-summary"><div><b>${apps.length}</b>个应用</div><div><b>${onlineCount}</b>个在线</div><div><b>${apps.length-onlineCount}</b>个离线</div></div>
      ${gridHtml}`;
  }
  async function aiLaunch(id){
    try{
      const r=await api('/api/ai-apps/launch','POST',{id});
      if(!r.ok){ toast('启动失败：'+(r.reason||''), true); return; }
      if(r.mode==='url' && r.url){ showEmbed(id, r.url, id); }
      else { toast(r.note||'已尝试启动'); await loadAiApps(); if(state.section==='ai-apps') renderAiApps(); }
    }catch(e){ toast('启动失败：'+e.message, true); }
  }
  function startAiAppsPoll(){
    stopAiAppsPoll();
    state.aiPollTimer=setInterval(()=>{
      if(state.section!=='ai-apps' || state.view==='embed') return;
      loadAiApps().then(()=>{ if(state.section==='ai-apps' && state.view!=='embed') renderAiApps(); });
    }, 12000);
  }
  function stopAiAppsPoll(){
    if(state.aiPollTimer){ clearInterval(state.aiPollTimer); state.aiPollTimer=null; }
  }

    const APP_LOGO_SVG='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg>';

      ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg>'
      : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>';
    const expandChevron = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg>';
    const sidebar=`<aside class="tool-sidebar${tsc}">
      <div class="tool-sidebar-head"><div class="tsh-brand"><span class="tsh-ico">${APP_LOGO_SVG}</span><h2>工具控制台</h2></div><p>本地能力 · 内嵌工作台</p>

    let main;

      const welcome=`<div class="tool-welcome">
        <div class="tw-ico">${TOOL_ICONS.tool}</div>
        <h3>工具控制台</h3>

        ${groupOrder.length?`<div style="font-size:12px;color:var(--txt-3);">共 ${all.length} 项能力 · ${groupOrder.length} 个分组</div>`:''}

    // 恢复左栏滚动位置，避免选中后跳回顶部
    requestAnimationFrame(()=>{
      const list=document.querySelector('.tool-sidebar-list');
      if(list && state._toolSidebarScroll>0) list.scrollTop=state._toolSidebarScroll;

    if(state.tool) bindToolPanel(state.tool);
    // 左栏 per-tool 实时运行点（探各自端口 /api/health，CORS 已开；失败静默灰点，不误导）

  // 右栏工作区：按工具 kind 分派到各自的「独立前端」渲染器
  function toolWorkspaceHTML(t, running){
    if(t.kind==='local' && TOOL_RENDERERS[t.renderer]) return TOOL_RENDERERS[t.renderer].render(t);
    if(t.kind==='script') return renderScriptConsole(t);
    if(t.kind==='external') return renderExternalApp(t);
    return renderWebApp(t, running);
  }
  function bindToolPanel(t){
    if(t.kind==='local' && TOOL_RENDERERS[t.renderer] && TOOL_RENDERERS[t.renderer].bind){
      try{ TOOL_RENDERERS[t.renderer].bind(); }catch(e){ console.error(e); }
    }
  }
  function refreshToolDot(id, port){
    const el=document.querySelector('.tsg-dot[data-dot="'+id+'"]');
    if(!el) return;
    fetch('http://127.0.0.1:'+port+'/api/health',{method:'GET'}).then(r=>{ el.classList.toggle('on', !!r.ok); })
      .catch(()=>{ el.classList.remove('on'); });
  }

  // ---------- 纯前端实用工具（完全脱离工具箱，自带前端与交互） ----------
  const COPY_SVG='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';

  // 原型占位提示（P0：未完成后端对接的工具统一显示，禁止空白 #tb-host、避免脚本异常）
  function protoPlaceholder(title, pure) {
    const tag = pure ? '纯原型占位' : '原型已就绪，后端对接开发中';
    const icon = pure ? '🧪' : '🚧';
    const sub = pure
      ? '该模块目前为纯前端原型占位，后端服务与数据对接尚未开始。'
      : '该模块前端原型已完成，后端服务对接开发中，完整功能将在后续版本开放。';
    return `<div class="tb-prototype-placeholder">
      <div class="tp-icon">${icon}</div>
      <div class="tp-title">${esc(title || '该模块')}</div>
      <div class="tp-tag">${tag}</div>
      <div class="tp-sub">${sub}</div>
    </div>`;
  }

  // 通用「真实端口工具」渲染器工厂：注入 #tb-host 容器 + 加载作用域 CSS + tb-shim(桥接层)
  // + 加载工具箱原页面脚本 + 调用 manager.init()。零 iframe、代码全内置、不丢功能。
  // cfg.prototype=true 时进入占位模式：只渲染提示，不加载脚本、不调用 init。
  function makePortRenderer(cfg) {
    const isProto = !!cfg.prototype;
    return {
      render(t) {
        if (isProto) {
          const title = cfg.protoTitle || (t && (t.name || t.title)) || '该模块';
          return `<div id="tb-host" class="tb-host">${protoPlaceholder(title, !!cfg.protoPure)}</div>`;
        }
        return `<div id="tb-host" class="tb-host">` + (cfg.html || '') + `</div>`;
      },
      async bind(t) {
        if (isProto) return; // 占位模式：不加载脚本、不调用 init，避免 404 与脚本异常

        // 已融合模块强制使用相对路径（当前 8768 主进程），不依赖外部 8081/880x 端口
        const base = (state.tool && state.tool.fused) ? '' : ((state.tool && state.tool.baseUrl) || '');
        window.__TB_BASE__ = base;
        const loadCss = (href) => new Promise(res => {
          if (document.querySelector('link[href="' + href + '"]')) return res();
          const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href;
          l.onload = () => res(); l.onerror = () => res(); document.head.appendChild(l);
        });
        const loadScript = (src) => new Promise(res => {
          if (window.__TB_LOADED__ && window.__TB_LOADED__[src]) return res();
          window.__TB_LOADED__ = window.__TB_LOADED__ || {};

        window.__TB_BASE__ = base;

        if (cfg.init) {
          const obj = window[cfg.init];

                <div id="pl-list"><div class="panel-hdr"><h3>我的歌单</h3><button id="new-pl" class="btn btn-sm">+ 新建</button></div><div id="pl-items"></div></div>
                <div id="pl-songs"><div class="empty-state"><div style="font-size:32px;opacity:.5">🎵</div><div style="margin-top:6px">选择一个歌单</div></div></div>
              </div>
            </div>
            <div class="music-tab-content" id="tab-queue">
              <div class="panel-hdr" style="padding:0 0 8px"><h3>播放队列</h3><div class="btn-group"><span id="queue-info" style="font-size:11px;color:var(--text3)">无歌曲</span><button id="queue-clear" class="btn btn-sm btn-ghost">清空</button></div></div>
              <div class="song-list" id="queue-list"><div class="empty-state"><div style="font-size:32px;opacity:.5">📋</div><div style="margin-top:6px">队列为空</div><div style="font-size:11px;color:var(--text3);margin-top:4px">搜索歌曲后点击 📋 加入队列即可播放</div></div></div>
            </div>
            <div class="music-tab-content" id="tab-local">
              <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0"><h3 style="font-size:13px">本地音乐</h3><span id="local-count" style="font-size:11px;color:var(--text3)"></span></div>
              <div class="song-list" id="local-list"><div class="empty-state"><div style="font-size:32px;opacity:.5">💿</div><div style="margin-top:6px">暂无本地音乐</div><div style="font-size:11px;color:var(--text3);margin-top:4px">下载歌曲后自动出现在这里</div></div></div>
            </div>
          </div>
          <div id="player-bar" class="player-bar hidden">
            <img id="pc-cover" class="player-cover" src="" alt="">
            <div class="player-info"><div class="player-title" id="pc-title">未播放</div><div class="player-artist" id="pc-artist"></div></div>
            <div class="player-ctrls">
              <button id="pp-shuffle" class="btn-icon mode-btn" title="随机播放">🔀</button>
              <button id="pp-prev" class="btn-icon">⏮️</button>
              <button id="pp-play" class="btn-icon" style="font-size:18px">▶️</button>
              <button id="pp-next" class="btn-icon">⏭️</button>
              <button id="pp-repeat" class="btn-icon mode-btn" title="循环模式">🔁</button>
              <span class="tm" id="pp-cur">0:00</span>
              <input type="range" id="pp-prog" min="0" max="100" value="0" class="slider">
              <span class="tm" id="pp-dur">0:00</span>
            </div>
            <div class="vol-wrap">
              <button id="pp-volbtn" class="vol-btn">🔊</button>
              <input type="range" id="pp-vol" min="0" max="100" value="50" class="slider">
            </div>
            <div class="player-acts">
              <button id="pp-collect" class="btn-icon" title="收藏到歌单">💾</button>
              <button id="pp-lyric" class="btn-icon" title="显示/隐藏歌词 (L)">🎤</button>
            </div>
          </div>
          <div class="lyric-wrap hidden" id="lyric-wrap"><div id="lyric-content"></div></div>
        </div></div></div></div>`;
      },
      bind(){
        const base=state.tool.baseUrl;
        if(!document.getElementById('music-css-link')){
          const l=document.createElement('link'); l.id='music-css-link'; l.rel='stylesheet'; l.href='assets/music.css';
          document.head.appendChild(l);
        }
        window.__MUSIC_BASE__ = base;
        window.toolbox = window.toolbox || {};
        window.toolbox.api = async (method, endpoint, body) => {
          const opts = { method: method.toUpperCase(), headers: { 'Content-Type': 'application/json' } };
          if (body && method.toUpperCase() !== 'GET') opts.body = JSON.stringify(body);
          const resp = await fetch(base + endpoint, opts);
          return await resp.json();
        };
        const initMusic = () => {
          try { if (window.musicManager && typeof window.musicManager.init === 'function') window.musicManager.init(); }
          catch(e){ console.error('[music] init 失败', e); toast('音乐组件初始化失败：'+((e&&e.message)||e), true); }
        };
        if (window.musicManager) { initMusic(); }
        else {
          const s=document.createElement('script'); s.src='assets/music-manager.js?v=2';
          s.onload=initMusic; s.onerror=()=>toast('音乐组件脚本加载失败', true);
          document.body.appendChild(s);
        }
      }
    },
  };
  async function openTool(id, kind, grp){
    const meta=state.toolboxMeta; if(!meta){ return; }
    // 保存左栏滚动位置，避免重新渲染后跳回顶部
    const list=document.querySelector('.tool-sidebar-list');
    if(list) state._toolSidebarScroll=list.scrollTop;
    let tool=null;
    if(kind==='script') tool=(meta.scripts||[]).find(t=>t.id===id);
    else tool=(meta.modules||[]).find(t=>t.id===id);
    if(!tool){ toast('未找到该工具', true); return; }
    tool.kind=kind; tool.group=grp;
    state.tool=tool; state.section='tools'; state.view='grid'; state.selectedId=null; state.toolRunning=false; state.toolLog='';
    stopSysmonPoll(); state.sysmonTimer=null;
    renderToolsPage(); // 先即时渲染（显示未运行），避免启动探测阻塞面板打开
    // 独立服务类工具：打开后异步探测是否已在运行（带超时，不阻塞）
    if(kind==='local' && tool.cmd && tool.baseUrl){
      const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),1500);
      fetch(tool.baseUrl+'/api/health',{method:'GET',signal:ctrl.signal}).then(r=>{ clearTimeout(to); if(r.ok){ state.toolRunning=true; renderToolsPage(); } })
        .catch(()=>{ clearTimeout(to); });
    }
  }
  // 工具工作区渲染已并入 renderToolsPage() → toolWorkspaceHTML()，此处不再单独维护
  function renderToolView(){ /* deprecated: use renderToolsPage() */ }
  function toolBack(){
    stopToolLogPoll(); stopSysmonPoll();
    state.tool=null; state.toolRunning=false; state.section='tools';
    document.querySelector('.main').classList.remove('is-tool');
    render();
  }
  async function toolboxStart(){
    try{
      await api('/api/toolbox/start','POST');
      toast('正在启动工具箱服务…');
      setTimeout(async()=>{ await loadToolboxMeta(); if(state.section==='tools'){ renderToolsPage(); } }, 2500);
    }catch(e){ toast('启动失败：'+e.message, true); }
  }
  function toolExternal(){
    const t=state.tool; if(!t) return;
    const baseUrl=(state.toolboxStatus&&state.toolboxStatus.baseUrl)||(state.toolboxMeta&&state.toolboxMeta.baseUrl)||'';
    const isRunning = !!(state.toolboxStatus && state.toolboxStatus.running);
    const url = t.kind==='external' ? t.url : (isRunning ? (baseUrl+(t.page||'')) : '');
    if(url) window.open(url,'_blank');
  }
  async function toolScriptToggle(){
    const t=state.tool; if(!t) return;
    const isService = (t.kind==='local' && t.cmd && t.baseUrl);
    if(t.kind!=='script' && !isService) return;
    if(state.toolRunning){
      try{
        if(isService){ await fetch(t.baseUrl+'/api/shutdown',{method:'POST'}); }
        else { await api('/api/tools/stop','POST',{id:t.id}); }
      }catch(e){}
      state.toolRunning=false; stopToolLogPoll(); stopSysmonPoll();
      const dot=document.getElementById('toolDot'); if(dot) dot.className='dot-st idle';
      const sub=document.getElementById('toolSub'); if(sub) sub.textContent='未运行';
      toast('已停止：'+t.name);
      renderToolsPage();
      return;
    }
    try{
      const r=await api('/api/tools/launch','POST',{id:t.id});
      if(!r.ok){ toast('启动失败：'+(r.reason||''), true); return; }
      state.toolRunning=true; state.toolLog=''; toast('已启动：'+t.name); renderToolsPage();
    }catch(e){ toast('启动失败：'+e.message, true); }
  }
  function startToolLogPoll(id){
    stopToolLogPoll();
    const tick=async()=>{ try{ const d=await api('/api/tools/log?id='+encodeURIComponent(id)); state.toolLog=d.log||''; const box=document.getElementById('toolLogBox'); if(box) box.textContent=state.toolLog; }catch(e){} };
    tick();
    state.toolLogTimer=setInterval(tick,1500);
  }
  function stopToolLogPoll(){ if(state.toolLogTimer){ clearInterval(state.toolLogTimer); state.toolLogTimer=null; } }
  // 独立服务类工具（如系统监控）实时指标轮询
  function startSysmonPoll(){
    stopSysmonPoll();
    const tick=async()=>{
      const t=state.tool; if(!t||!t.baseUrl) return;
      try{
        const r=await fetch(t.baseUrl+'/api/metrics',{method:'GET'});
        if(!r.ok){ return; }
        const m=await r.json();
        const fn=window.__sysmonUpdate; if(fn) fn(m);
      }catch(e){}
    };
    tick();
    state.sysmonTimer=setInterval(tick,1500);
  }
  function stopSysmonPoll(){ if(state.sysmonTimer){ clearInterval(state.sysmonTimer); state.sysmonTimer=null; } }

  function bindEvents(){
    const toggleSidebar=()=>{
      state.sidebarCollapsed=!state.sidebarCollapsed;
      document.getElementById('sidebar').classList.toggle('collapsed',state.sidebarCollapsed);
    };
    document.getElementById('btnCollapse').addEventListener('click',toggleSidebar);
    const sbToggle=document.getElementById('sidebarToggle');
    if(sbToggle) sbToggle.addEventListener('click',toggleSidebar);
    document.getElementById('btnScan').addEventListener('click',doScan);
    document.getElementById('btnScanTop').addEventListener('click',doScan);
    document.getElementById('btnAddTop').addEventListener('click',openAddModal);
    document.getElementById('btnSettings').addEventListener('click',openSettingsModal);
  document.getElementById('btnAbout').addEventListener('click',openAboutModal);
  document.getElementById('btnChangelog').addEventListener('click',openChangelogModal);
  document.getElementById('assistantFab').addEventListener('click',openAssistant);
  document.getElementById('assClose').addEventListener('click',closeAssistant);
  document.getElementById('assSettings').addEventListener('click',function(){ var s=document.getElementById('assSet'); if(s) s.classList.toggle('show'); });
  document.getElementById('assClear').addEventListener('click',function(){ state.assistMsgs=[]; renderAssistMsgs(); });
  document.getElementById('assSaveCfg').addEventListener('click',function(){
    var cfg={ provider:(document.getElementById('assProvider').value||'ollama'), baseUrl:(document.getElementById('assBaseUrl').value.trim()||'http://127.0.0.1:11434'), model:(document.getElementById('assModel').value.trim()||'') };
    saveAssistCfg(cfg); toast('助手后端已保存（本浏览器）');
  });
  document.getElementById('assSend').addEventListener('click',sendAssistant);
  document.getElementById('assistantInput').addEventListener('keydown',function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendAssistant(); } });
  document.getElementById('obAbout').addEventListener('click',function(){ dismissOnboard(); openAboutModal(); });
  document.getElementById('obClose').addEventListener('click',dismissOnboard);
    document.getElementById('btnRefresh').addEventListener('click',()=>loadResources(true));
    const mainSearch=document.getElementById('mainSearch');
    if(mainSearch) mainSearch.addEventListener('input',e=>{state.mainQuery=e.target.value;render();});

    // 本台服务菜单
    document.getElementById('btnSelf').addEventListener('click',(e)=>{ e.stopPropagation(); toggleSelfMenu(); });
    document.addEventListener('click',(e)=>{
      const wrap = e.target.closest('.self-menu-wrap');
      if(!wrap && state.self.open) toggleSelfMenu(false);
    });
    document.getElementById('smRestart').addEventListener('click', doSelfRestart);
    document.getElementById('smStop').addEventListener('click', doSelfStop);
    document.getElementById('smLogs').addEventListener('click', viewSelfLogs);
    document.getElementById('smOpenDir').addEventListener('click', openSelfDir);

    // 文件管理视图切换
    document.getElementById('btnFiles').addEventListener('click',()=>{
      if(state.files.active) exitFiles(); else enterFiles();
    });

    document.getElementById('embedBack').addEventListener('click',hideEmbed);
    document.getElementById('embedRefresh').addEventListener('click',refreshEmbed);
    document.getElementById('embedExternal').addEventListener('click',openEmbedExternal);
    document.getElementById('btnEnter').addEventListener('click',enterWorkbench);
    document.addEventListener('keydown',onKey);

    // 控制台分区切换：按钮渲染在 #consoleNav，需独立绑定
    document.getElementById('consoleNav').addEventListener('click',e=>{
      const btn=e.target.closest('[data-action="section"]');
      if(!btn) return;
      selectSection(btn.dataset.key);
    });

    document.getElementById('contentBody').addEventListener('click',e=>{
      const btn=e.target.closest('[data-action]');
      if(!btn) return;
      const action=btn.dataset.action;
      const id=btn.dataset.id;
      if(action==='filter'){state.filter=btn.dataset.kind;state.view='grid';state.selectedId=null;render();}
      else if(action==='scanAll'){ doScan(); }
      else if(action==='addAsset'){ openAddModal(); }
      else if(action==='select'){state.selectedId=id;state.view='detail';render();}
      else if(action==='detail'){state.selectedId=id;state.view='detail';render();}
      else if(action==='back'){state.view='grid';state.selectedId=null;render();}
      else if(action==='launch'){doLaunch(id);}
      else if(action==='open'){doOpen(id);}
      else if(action==='stop'){doStop(id);}
      else if(action==='edit'){openEditModal(id);}
      else if(action==='delete'){deleteResource(id);}
      else if(action==='reload'){loadResources(true);}
      else if(action==='toggleGroup'){ const key=btn.dataset.key; if(key){ state.collapsedGroups[key]=!state.collapsedGroups[key]; render(); } }
      // 文件管理视图内的操作
      else if(action==='frRoot'){ loadFileList(btn.dataset.path); }
      else if(action==='fileBc'){ loadFileList(btn.dataset.path); }
      else if(action==='fileRow'){ onFileRowClick(btn.dataset.name, btn.dataset.type); }
      else if(action==='fileUp'){ const p=state.files.path; const up=dirName(p); loadFileList(up); }
      else if(action==='fileNewFolder'){ newFolder(); }
      else if(action==='fileNewFile'){ newFile(); }
      else if(action==='fileRefresh'){ loadFileList(state.files.path); }
      else if(action==='fileZoomIn'){ setFileScale(Math.min(2,state.files.scale+1)); }
      else if(action==='fileZoomOut'){ setFileScale(Math.max(0,state.files.scale-1)); }
      else if(action==='toggleFileRoots'){
        state.fileRootsCollapsed = !state.fileRootsCollapsed;
        const fr=document.querySelector('.file-roots');
        if(fr) fr.classList.toggle('collapsed', state.fileRootsCollapsed);
        return;
      }
      else if(action==='toggleToolSidebar'){
        state.toolSidebarCollapsed = !state.toolSidebarCollapsed;
        const sb=document.querySelector('.tool-sidebar');
        if(sb) sb.classList.toggle('collapsed', state.toolSidebarCollapsed);
        return;
      }
      // 本台服务面板
      else if(action==='selfRestart'){ doSelfRestart(); }
      else if(action==='selfStop'){ doSelfStop(); }
      else if(action==='selfLogs'){ viewSelfLogs(); }
      else if(action==='selfOpenDir'){ openSelfDir(); }
      else if(action==='selfStartup'){ toggleStartup(); }
      // AI 应用工作台
      else if(action==='aiEmbed'){ showEmbed(btn.dataset.id, btn.dataset.url, btn.dataset.name); }
      else if(action==='aiExternal'){ if(btn.dataset.url) window.open(btn.dataset.url,'_blank'); }
      else if(action==='aiLaunch'){ aiLaunch(btn.dataset.id); }
      else if(action==='aiRefresh'){ loadAiApps().then(()=>{ if(state.section==='ai-apps') renderAiApps(); }); }
      // 工具箱
      else if(action==='openTool'){ openTool(btn.dataset.id, btn.dataset.kind, btn.dataset.grp); }
      else if(action==='toolboxStart'){ toolboxStart(); }
      else if(action==='toolBack'){ toolBack(); }
      else if(action==='toolRefresh'){ const f=document.getElementById('toolFrame'); if(f) f.src=f.src; }
      else if(action==='toolExternal'){ toolExternal(); }
      else if(action==='toolOpenUrl'){ const t=state.tool; if(t&&t.url) window.open(t.url,'_blank'); }
      else if(action==='toolScriptToggle'){ toolScriptToggle(); }
      else if(action==='toolClearLog'){ state.toolLog=''; const box=document.getElementById('toolLogBox'); if(box) box.textContent='(暂无日志)'; }
      else if(action==='refreshSysmon'){ overviewMonitorTick('sysmon'); }
      else if(action==='refreshDash'){ overviewMonitorTick('dash'); }
      else if(action==='runOnce'){ runOnce(id); }
      else if(action==='probePort'){ const port=parseInt(btn.dataset.port,10); if(port) probePortOnce(port); }
    });

    // 概括页顶部 hero 的操作按钮（在 content-head 内，与 contentBody 分离，需独立委托）
    document.getElementById('overviewHero').addEventListener('click',e=>{
      const btn=e.target.closest('[data-action]');
      if(!btn) return;
      const action=btn.dataset.action;
      if(action==='scanAll') doScan();
      else if(action==='addAsset') openAddModal();
      else if(action==='reload') loadResources(true);
    });

    // 文件列表右键菜单
    document.getElementById('contentBody').addEventListener('contextmenu',e=>{
      if(!state.files.active) return;
      const row=e.target.closest('.file-row');
      if(!row) return;
      e.preventDefault();
      const name=row.dataset.name, type=row.dataset.type;
      state.files.selected=name; renderFileView();
      fileContextMenu(name, type, e.clientX, e.clientY);
    });

    // Ctrl+滚轮缩放：工具控制台页 → 工具缩放；文件视图 → 文件缩放
    document.getElementById('contentBody').addEventListener('wheel',e=>{
      if(!e.ctrlKey) return;
      const delta = e.deltaY < 0 ? 1 : -1;
      if(state.section==='tools'){
        e.preventDefault();
        const next = Math.max(0, Math.min(2, state.toolsScale + delta));
        if(next !== state.toolsScale) setToolScale(next);
      } else if(state.files.active){
        e.preventDefault();
        const next = Math.max(0, Math.min(2, state.files.scale + delta));
        if(next !== state.files.scale) setFileScale(next);
      }
    }, { passive: false });

    document.getElementById('categoryTabs').addEventListener('click',e=>{
      const btn=e.target.closest('[data-action="filter"]');
      if(btn){state.filter=btn.dataset.kind;state.view='grid';state.selectedId=null;render();}
    });

    const sysChk=document.getElementById('sysToggleChk');
    if(sysChk) sysChk.addEventListener('change',e=>{state.showSystem=e.target.checked;render();});
  }

  bindEvents();
  rotateBgIfNeeded();
  startTick();
  if(location.protocol==='file:'){
    state.error='本工作台需通过本地服务运行：请先双击 <项目目录>\\start.bat 启动后端，再用浏览器打开 http://127.0.0.1:8768/（直接双击 HTML 文件会因无法连接后端 API 而加载失败）。';
    render();
    return;
  }
  loadSettings();
  applySettings();
  loadResources();
  fetchSelfStatus();
  loadLandingMetrics();
  if(location.hash==='#workbench') enterWorkbench();
  else if(location.hash==='#tools'){ enterWorkbench(); setTimeout(()=>selectSection('tools'),400); }
  // 后台不再轮询本台服务状态；用户可通过概览页「本台服务」卡手动刷新或页面刷新。
})();
</script>
