<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="description" content="聚创台 · 本地工具与 AI 应用统一管理工作台">
<link rel="icon" type="image/png" href="assets/favicon.png">
<title>聚创台 · 本地工具与 AI 应用统一管理工作台</title>
<style>
  :root{
    /* New API 深色主题：深黑灰底 + 蓝青主色 */
    --bg:#0d1117; --bg-2:#11171f; --bg-3:#161c27; --bg-soft:#0f141c;
    --card:#181f2a; --card-hover:#1f2734; --card-active:#232c3b;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.18);
    --ink:#f0f6fc; --navy:#58a6ff; --txt:#c9d1d9; --txt-2:#8b949e; --txt-3:#6e7681;
    --indigo:#3b82f6; --violet:#8b5cf6; --blue:#3b82f6; --blue-light:#06b6d4;
    --primary:linear-gradient(135deg,#3b82f6,#06b6d4);
    --primary-solid:#3b82f6; --primary-soft:rgba(59,130,246,.18);
    --navy-grad:linear-gradient(135deg,#11171f 0%,#0d1117 100%);
    --ok:#2ea043; --ok-soft:rgba(46,160,67,.15); --warn:#d29922; --warn-soft:rgba(210,153,34,.15);
    --danger:#f85149; --danger-soft:rgba(248,81,73,.15); --mute:#6e7681;
    --radius:14px; --radius-lg:18px; --radius-sm:10px;
    --shadow-sm:0 2px 8px rgba(0,0,0,.32);
    --shadow:0 8px 24px rgba(0,0,0,.40);
    --shadow-lg:0 20px 56px rgba(0,0,0,.52);
    --sidebar-w:240px;
    /* 可配置项（外观设置写入） */
    --font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-scale:1;
  }
  /* ===== 主题模式：仅切换配色变量，绝不动背景图 ===== */
  [data-theme="dark"]{
    --bg:#0d1117; --bg-2:#11171f; --bg-3:#161c27; --bg-soft:#0f141c;
    --card:#181f2a; --card-hover:#1f2734; --card-active:#232c3b;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.18);
    --ink:#f0f6fc; --navy:#58a6ff; --txt:#c9d1d9; --txt-2:#8b949e; --txt-3:#6e7681;
  }
  [data-theme="light"]{
    --bg:#f4f6f9; --bg-2:#ffffff; --bg-3:#eef1f5; --bg-soft:#eef1f5;
    --card:#ffffff; --card-hover:#f2f4f7; --card-active:#e7ebf0;
    --line:rgba(15,23,42,.10); --line-2:rgba(15,23,42,.14); --line-strong:rgba(15,23,42,.22);
    --ink:#0f172a; --navy:#2563eb; --txt:#334155; --txt-2:#64748b; --txt-3:#94a3b8;
  }
  [data-theme="light"] .landing-title{background:linear-gradient(120deg,#0f172a,#0369a1);-webkit-background-clip:text;background-clip:text;color:transparent;}
  [data-theme="light"] .app-bg-grid{opacity:.05;}
  [data-theme="eye"]{
    --bg:#c9e3c6; --bg-2:#d6ebd1; --bg-3:#c2ddbe; --bg-soft:#c2ddbe;
    --card:#e2efe0; --card-hover:#d8e8d4; --card-active:#cfe2c9;
    --line:rgba(40,60,35,.14); --line-2:rgba(40,60,35,.18); --line-strong:rgba(40,60,35,.26);
    --ink:#243024; --navy:#2f7d3f; --txt:#33402f; --txt-2:#5c6b54; --txt-3:#7c8a72;
  }
  [data-theme="eye"] .landing-title{background:linear-gradient(120deg,#243024,#2f7d3f);-webkit-background-clip:text;background-clip:text;color:transparent;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--txt);font-family:var(--font-family);font-size:calc(14px * var(--font-scale));line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;}
  .app-bg-layer{position:fixed;inset:0;z-index:-2;background:center/cover no-repeat;transition:background-image 1.2s ease-in-out;filter:blur(8px) brightness(0.9) saturate(1.1);transform:scale(1.08);}
  .app-bg-overlay{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 18% 22%,rgba(59,130,246,.10),transparent 45%),radial-gradient(circle at 82% 78%,rgba(6,182,212,.08),transparent 45%),linear-gradient(180deg,rgba(13,17,23,.78) 0%,rgba(13,17,23,.86) 100%);}
  .app-bg-grid{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(circle at 50% 50%,rgba(0,0,0,.45),transparent 70%);-webkit-mask-image:radial-gradient(circle at 50% 50%,rgba(0,0,0,.45),transparent 70%);}
  .app-bg-orb{position:fixed;z-index:-1;border-radius:50%;filter:blur(80px);pointer-events:none;opacity:.55;animation:orbMove 18s ease-in-out infinite alternate;}
  .app-bg-orb.orb-1{width:420px;height:420px;background:rgba(59,130,246,.16);top:10%;left:5%;}
  .app-bg-orb.orb-2{width:360px;height:360px;background:rgba(6,182,212,.12);bottom:15%;right:8%;animation-delay:-9s;}
  .app-bg-orb.orb-3{width:300px;height:300px;background:rgba(139,92,246,.14);top:55%;left:25%;animation-delay:-5s;animation-duration:22s;}
  .app-bg-noise{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.035;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
  @keyframes orbMove{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,-30px) scale(1.12)}}
  [hidden]{display:none !important;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:999px;border:2px solid var(--bg);}
  ::-webkit-scrollbar-thumb:hover{background:#5c6570;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* 按钮 */
  .btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 14px;border-radius:9px;font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid transparent;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s,transform .1s,color .15s;-webkit-tap-highlight-color:transparent;text-decoration:none;background:none;}
  .btn:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;}
  .btn:active:not(:disabled){transform:translateY(1px);}
  .btn:disabled,.btn.is-disabled{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none;}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.26);}
  .btn-primary:hover:not(:disabled){box-shadow:0 6px 18px rgba(79,70,229,.38);}
  .btn-ghost{background:transparent;color:var(--navy);border-color:var(--line-2);}
  .btn-ghost:hover:not(:disabled){background:var(--bg-3);border-color:var(--line-strong);}
  .btn-navy{background:var(--card);color:var(--ink);border-color:var(--line);}
  .btn-navy:hover:not(:disabled){background:var(--card-hover);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover:not(:disabled){background:#c41e1e;}
  .btn-icon{padding:0;width:36px;min-width:36px;}
  .btn-sm{min-height:30px;padding:0 10px;font-size:12.5px;border-radius:7px;}
  .btn-xs{min-height:24px;padding:0 8px;font-size:11.5px;border-radius:6px;}
  .btn.is-loading{color:transparent !important;position:relative;pointer-events:none;}
  .btn.is-loading::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;animation:spin .7s linear infinite;}
  .btn-ghost.is-loading::after{border-color:rgba(79,70,229,.3);border-top-color:var(--indigo);}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* 顶部栏 */
  .app-topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg-2);color:var(--ink);border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm);height:54px;}
  .app-topbar .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .logo-mark{width:30px;height:30px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 12px rgba(59,130,246,.28);}
  .t-name{font-weight:800;font-size:16px;letter-spacing:.4px;color:var(--ink);}
  .t-sub{color:var(--txt-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;}
  .spacer{flex:1;}
  .status-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--bg-3);border:1px solid var(--line);font-size:12px;color:var(--txt-2);}
  .status-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);}
  .app-topbar .btn-ghost{background:var(--bg-3);color:var(--txt);border-color:var(--line);}
  .app-topbar .btn-ghost:hover:not(:disabled){background:var(--card-hover);border-color:var(--line-2);color:var(--ink);}

  /* 布局 */
  .app-body{display:flex;flex:1;align-items:stretch;height:calc(100vh - 54px);overflow:hidden;}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);position:relative;}

  /* 左侧控制台 */
  .sidebar{width:var(--sidebar-w);flex:none;background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:width .24s ease;position:relative;overflow:hidden;}
  .sidebar-head{padding:18px 16px 6px;font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--txt-3);text-transform:uppercase;}
  .sidebar-toggle{position:absolute;top:10px;right:10px;z-index:5;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg-3);color:var(--txt-2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s;}
  .sidebar-toggle:hover{background:var(--card);color:var(--ink);}
  .sidebar.collapsed{width:64px;}
  .sidebar.collapsed .sidebar-toggle{right:50%;transform:translateX(50%);}
  .sidebar.collapsed .sidebar-head,.sidebar.collapsed .sidebar-foot span,.sidebar.collapsed .ci-meta{display:none;}
  .sidebar.collapsed .console-item{justify-content:center;padding:12px 0;}
  .sidebar.collapsed .console-item .ci-ico{margin:0;}
  .sidebar.collapsed .sidebar-foot{justify-content:center;padding:14px 0;}
  .topbar-toggle{margin-right:2px;}
  .sf-about{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);background:var(--bg-3);color:var(--txt-2);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;}
  .sf-about:hover{background:var(--card);color:var(--ink);}
  .onboard-banner{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;display:none;align-items:center;gap:12px;max-width:560px;padding:12px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line-strong);box-shadow:var(--shadow-lg);font-size:13px;color:var(--txt);}
  .onboard-banner.show{display:flex;}
  .onboard-banner b{color:var(--ink);}
  .onboard-banner .ob-link{color:var(--navy);font-weight:700;cursor:pointer;white-space:nowrap;}
  .onboard-banner .ob-close{margin-left:2px;cursor:pointer;color:var(--txt-3);font-size:18px;line-height:1;padding:0 4px;}
  .assistant-fab{position:fixed;right:20px;bottom:20px;z-index:45;width:52px;height:52px;border-radius:50%;border:1px solid var(--line-strong);background:var(--primary);color:#fff;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);transition:transform .15s,background .15s;}
  .assistant-fab:hover{transform:scale(1.06);background:var(--primary-strong);}
  .assistant-panel{position:fixed;right:20px;bottom:84px;z-index:45;width:360px;max-width:calc(100vw - 40px);height:480px;max-height:calc(100vh - 110px);display:none;flex-direction:column;background:var(--card);border:1px solid var(--line-strong);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;}
  .assistant-panel.show{display:flex;}
  .ass-panel-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg-2);}
  .ass-panel-head .ah-title{font-weight:700;font-size:14px;color:var(--ink);flex:1;}
  .ass-panel-head .ah-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg-3);color:var(--txt-2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .ass-panel-head .ah-btn:hover{background:var(--card-hover);color:var(--ink);}
  .ass-msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
  .ass-msg{padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.7;max-width:88%;white-space:pre-wrap;word-break:break-word;}
  .ass-msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px;}
  .ass-msg.bot{align-self:flex-start;background:var(--bg-3);color:var(--ink);border:1px solid var(--line);border-bottom-left-radius:4px;}
  .ass-msg.sys{align-self:stretch;background:transparent;color:var(--txt-3);font-size:12px;text-align:center;}
  .ass-msg .ass-spin{display:inline-block;width:14px;height:14px;border:2px solid var(--primary-soft);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;}
  .ass-set{display:none;flex-direction:column;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg-2);}
  .ass-set.show{display:flex;}
  .ass-set label{font-size:11px;font-weight:600;color:var(--navy);}
  .ass-set input,.ass-set select{font-size:12px;}
  .ass-input-row{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);}
  .ass-input-row textarea{flex:1;resize:none;height:42px;font-family:inherit;font-size:13px;padding:8px 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);}
  .ass-input-row textarea:focus{border-color:var(--navy);box-shadow:0 0 0 2px var(--primary-soft);}
  .about-body{padding:18px 22px;}
  .ab-hero{display:flex;align-items:baseline;gap:10px;}
  .ab-name{font-size:20px;font-weight:800;color:var(--ink);}
  .ab-ver{font-size:13px;color:var(--txt-3);font-weight:600;}
  .ab-tag{margin:8px 0 4px;font-size:14px;color:var(--ink);font-weight:600;}
  .ab-pos{font-size:13px;color:var(--txt-2);line-height:1.8;background:var(--bg-3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px;}
  .about-body h4{margin:14px 0 8px;font-size:13px;font-weight:700;color:var(--navy);}
  .ab-list{margin:0;padding-left:18px;color:var(--txt);font-size:13px;line-height:1.9;}
  .ab-list b{color:var(--ink);}
  .ab-ext{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px;}
  .ab-ext-k{color:var(--navy);font-weight:700;flex:none;width:84px;}
  .ab-ext-v{color:var(--txt-2);line-height:1.7;}
  .console-nav{flex:1;display:flex;flex-direction:column;gap:4px;padding:8px;}

  /* 内容区头部 */
  .content-head{padding:12px 22px 8px;border-bottom:1px solid var(--line);background:var(--bg-2);}
  .ch-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .ch-title h1{margin:0;font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.3px;}
  .ch-title p{margin:1px 0 0;font-size:12px;color:var(--txt-2);}
  .ch-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .ch-actions .btn{min-height:28px;padding:0 11px;font-size:12px;}
  .ch-filterbar{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;}
  .ch-tabs{display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;padding:0 0 2px;}
  .ch-tab{flex:none;padding:4px 9px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg-3);color:var(--txt-2);font-size:11.5px;font-weight:650;cursor:pointer;transition:all .15s;}
  .ch-tab:hover{background:var(--card);color:var(--navy);border-color:var(--line-strong);}
  .ch-tab.active{background:var(--primary);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(59,130,246,.26);}
  .ch-tab .tcnt{margin-left:5px;font-size:11px;opacity:.75;}
  .sys-toggle{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--txt-2);cursor:pointer;user-select:none;white-space:nowrap;margin-left:auto;}
  .sys-toggle input{width:15px;height:15px;accent-color:var(--navy);cursor:pointer;}
  .ch-count{margin-left:auto;font-size:12.5px;color:var(--txt-3);white-space:nowrap;}
  .ch-search-wrap{flex:1;min-width:180px;max-width:260px;position:relative;}
  .ch-search-wrap input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--line-2);border-radius:999px;background:var(--bg-3);font-size:13px;color:var(--txt);outline:none;transition:border-color .15s;}
  .ch-search-wrap input:focus{border-color:var(--navy);box-shadow:0 0 0 2px var(--primary-soft);}
  .ch-search-wrap input::placeholder{color:var(--txt-3);}
  .ch-search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--txt-3);}

  .content-body{flex:1;overflow-y:auto;padding:12px 22px 24px;background:var(--bg);}
  .content-body.files-mode{padding:0;}

  /* 分组 */
  .group{margin-bottom:24px;}
  .group-head{display:flex;align-items:center;gap:8px;margin:0 0 12px;}
  .group-head .g-bar{width:3px;height:16px;border-radius:2px;background:var(--primary);}
  .group-head h3{margin:0;font-size:14px;font-weight:750;color:var(--ink);}
  .group-head .g-count{font-size:12px;color:var(--txt-3);}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
  /* 端口按进程聚合：可折叠分组 */
  .group.collapsible .group-head{cursor:pointer;user-select:none;padding:4px 6px;margin:0 -6px 12px;border-radius:8px;transition:background .12s;}
  .group.collapsible .group-head:hover{background:var(--bg-2);}
  .group.collapsible .g-chev{display:inline-flex;color:var(--txt-3);transition:transform .18s ease;}
  .group.collapsible.collapsed .g-chev{transform:rotate(-90deg);}
  .group.collapsed .cards{display:none;}
  .group.collapsible .g-count{margin-left:auto;}

  /* 卡片 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,box-shadow .15s,transform .15s,background .15s;position:relative;overflow:hidden;}
  .card:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-1px);background:var(--card-hover);}
  .card-top{display:flex;align-items:flex-start;gap:11px;}
  .c-ico{width:38px;height:38px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;}
  .c-ico.k-app{background:linear-gradient(135deg,#2563eb,#4f46e5);}
  .c-ico.k-web{background:linear-gradient(135deg,#0d9488,#22c55e);}
  .c-ico.k-web-service{background:linear-gradient(135deg,#0ea5e9,#6366f1);}
  .c-ico.k-port{background:linear-gradient(135deg,#475569,#64748b);}
  .c-ico.k-mini-program{background:linear-gradient(135deg,#7c3aed,#c026d3);}
  .c-ico.k-script{background:linear-gradient(135deg,#b45309,#d97706);}
  .c-ico.k-file{background:linear-gradient(135deg,#475569,#94a3b8);}
  .c-ico.k-attachment{background:linear-gradient(135deg,#64748b,#a855c9);}
  .c-meta{flex:1;min-width:0;}
  .c-name{font-size:15px;font-weight:750;color:var(--ink);display:flex;align-items:center;gap:7px;overflow:hidden;}
  .c-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .c-path{font-size:11.5px;color:var(--txt-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .c-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px;}
  .tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--bg-3);color:var(--txt-2);}
  .tag-port{background:rgba(59,130,246,.15);color:#60a5fa;}
  .tag-online{background:var(--ok-soft);color:var(--ok);}
  .tag-offline{background:var(--danger-soft);color:var(--danger);}
  .tag-source{background:rgba(139,92,246,.15);color:#a78bfa;}
  .tag-new{background:rgba(46,160,67,.15);color:var(--ok);}
  .tag-system{background:rgba(255,255,255,.06);color:var(--txt-3);border:1px solid var(--line);}
  .tag-noui{background:rgba(210,153,34,.15);color:var(--warn);border:1px solid rgba(210,153,34,.2);}
  .c-desc{font-size:13px;color:var(--txt-2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px;}
  .c-actions{display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:auto;padding-top:11px;}
  .c-actions .btn{flex:1;min-width:0;}
  .c-actions .btn-sm{font-size:12px;}
  .card-removed{opacity:.6;background:repeating-linear-gradient(45deg,var(--card),var(--card) 10px,var(--bg-2) 10px,var(--bg-2) 20px);}
  .card-removed .c-name{text-decoration:line-through;text-decoration-color:var(--txt-3);}

  /* 详情 / 嵌入 */
  .detail{max-width:760px;margin:0 auto;}
  .detail-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .detail-head .c-ico{width:48px;height:48px;border-radius:12px;}
  .detail-head h2{margin:0;font-size:20px;font-weight:800;color:var(--ink);}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
  .panel h4{margin:0 0 12px;font-size:14px;font-weight:750;color:var(--ink);display:flex;align-items:center;gap:8px;}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13px;}
  .kv dt{color:var(--txt-3);font-weight:600;}
  .kv dd{margin:0;color:var(--txt);word-break:break-all;}

  /* 通用运行面板 */
  .run-panel .rp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .run-panel .rp-meta{font-size:12px;color:var(--txt-3);}
  .run-output{max-height:320px;overflow:auto;background:#0d1117;border:1px solid var(--line);border-radius:var(--radius);padding:12px;font-family:var(--mono);font-size:12px;line-height:1.55;color:#e6edf3;white-space:pre-wrap;word-break:break-all;margin:0;}
  .run-output:empty{display:none;}
  .run-empty{padding:18px 4px;text-align:center;font-size:13px;color:var(--txt-3);}
  .probe-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .probe-status{font-size:13px;font-weight:700;}
  .probe-status.ok{color:var(--ok);}
  .probe-status.bad{color:var(--danger);}

  /* 表单 */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:12px;font-weight:600;color:var(--navy);}
  .input,.select,.textarea{width:100%;font-size:14px;font-family:inherit;color:var(--txt);background:var(--bg-3);border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;outline:none;transition:border-color .15s,box-shadow .15s;}
  .input:focus,.select:focus,.textarea:focus{border-color:var(--navy);box-shadow:0 0 0 2px var(--primary-soft);}
  .input::placeholder,.textarea::placeholder{color:var(--txt-3);}
  .textarea{resize:vertical;min-height:76px;line-height:1.6;}

  /* 边界态 */
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 20px;gap:12px;color:var(--txt-2);}
  .empty .e-ico{width:68px;height:68px;border-radius:18px;background:var(--bg-2);display:flex;align-items:center;justify-content:center;color:var(--txt-3);}
  .empty h3{margin:0;font-size:16px;font-weight:700;color:var(--ink);}
  .empty p{margin:0;font-size:13px;max-width:380px;color:var(--txt-2);}
  .skeleton{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
  .sk-card{height:130px;border-radius:var(--radius);background:linear-gradient(100deg,var(--bg-2) 30%,var(--bg-3) 50%,var(--bg-2) 70%);background-size:200% 100%;animation:shimmer 1.2s infinite;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  .errbox{border:1px solid rgba(248,81,73,.35);background:var(--danger-soft);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;max-width:620px;margin:24px auto;}
  .errbox h3{margin:0;font-size:15px;font-weight:750;color:var(--danger);}
  .errbox p{margin:0;font-size:13px;color:var(--txt-2);line-height:1.6;}

  /* 扫描遮罩 */
  .scan-overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;}
  .scan-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:26px 30px;width:min(90vw,380px);box-shadow:var(--shadow-lg);text-align:center;}
  .scan-spinner{width:40px;height:40px;margin:0 auto 14px;border-radius:50%;border:4px solid var(--primary-soft);border-top-color:var(--navy);animation:spin .8s linear infinite;}
  .scan-box h3{margin:0 0 4px;font-size:15px;font-weight:750;color:var(--ink);}
  .scan-stage{font-size:12.5px;color:var(--txt-2);min-height:18px;}

  /* Toast */
  #toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:99;max-width:min(92vw,420px);padding:11px 18px;border-radius:12px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:13.5px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .24s,transform .24s;}
  #toast.show{opacity:1;transform:translate(-50%,0);}
  #toast.err{background:rgba(248,81,73,.14);color:var(--danger);border-color:rgba(248,81,73,.35);}

  /* Modal */
  .modal-mask{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.65);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .18s ease;}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:min(94vw,520px);max-height:90vh;display:flex;flex-direction:column;animation:pop .18s cubic-bezier(.22,1,.36,1);}
  .modal-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);}
  .modal-head h3{margin:0;font-size:16px;font-weight:750;color:var(--ink);flex:1;}
  .modal-body{padding:18px;overflow-y:auto;}
  .modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;}
  /* ===== 设置面板（四组：外观 / 工作台 / 快捷键 / 数据） ===== */
  .settings-modal{width:min(94vw,720px);}
  /* 本地能力发现向导 */
  .discover-modal{width:min(94vw,640px);}
  .disc-list{display:flex;flex-direction:column;gap:8px;max-height:54vh;overflow:auto;padding-right:4px;}
  .disc-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg-3);}
  .disc-main{flex:1;min-width:0;}
  .disc-name{font-size:13.5px;font-weight:700;color:var(--ink);}
  .disc-meta{font-size:11.5px;color:var(--txt-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .disc-tag{font-size:11px;color:var(--txt-2);background:var(--card-active);border:1px solid var(--line);border-radius:999px;padding:3px 9px;flex:none;}
  .disc-empty{padding:28px 8px;text-align:center;color:var(--txt-3);font-size:13px;}
  .settings-layout{display:flex;min-height:340px;}
  .settings-tabs{width:130px;flex:none;border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:4px;background:var(--bg-2);}
  .settings-tabs .stab{appearance:none;border:0;background:transparent;color:var(--txt-2);text-align:left;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .12s,color .12s;}
  .settings-tabs .stab:hover{background:var(--card-hover);color:var(--txt);}
  .settings-tabs .stab.active{background:var(--card-active);color:var(--ink);}
  .settings-content{flex:1;min-width:0;padding:18px 20px;overflow-y:auto;}
  .set-group h4{margin:0 0 12px;font-size:14px;font-weight:750;color:var(--ink);}
  .set-group h4:not(:first-child){margin-top:20px;}
  .set-hint{margin:-6px 0 12px;font-size:12px;color:var(--txt-3);}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);}
  .set-row label{font-size:13px;color:var(--txt);font-weight:600;}
  .set-control{display:flex;align-items:center;gap:8px;min-width:200px;justify-content:flex-end;}
  .set-control .select{min-height:32px;width:auto;padding:6px 10px;}
  .theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
  .theme-card{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg-3);cursor:pointer;transition:border-color .15s,background .15s;text-align:left;font-family:inherit;}
  .theme-card:hover{border-color:var(--line-2);}
  .theme-card.active{border-color:var(--navy);background:var(--card-active);}
  .tc-swatch{width:30px;height:30px;border-radius:8px;flex:none;border:1px solid var(--line-2);}
  .tc-swatch.t-dark{background:#0d1117;}
  .tc-swatch.t-light{background:#f4f6f9;}
  .tc-swatch.t-eye{background:#c9e3c6;}
  .tc-swatch.t-system{background:linear-gradient(135deg,#0d1117 50%,#f4f6f9 50%);}
  .tc-meta{display:flex;flex-direction:column;line-height:1.35;}
  .tc-meta b{font-size:13px;color:var(--ink);}
  .tc-meta i{font-size:11px;color:var(--txt-3);font-style:normal;}
  .hk-list{display:flex;flex-direction:column;gap:2px;}
  .hk-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--txt);}
  .hk-row kbd{background:var(--bg-3);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;padding:2px 8px;font-size:11.5px;color:var(--txt-2);font-family:ui-monospace,Menlo,Consolas,monospace;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}

  /* 内嵌预览（服务直接在右侧打开） */
  .embed-view{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg);}
  .embed-view[hidden]{display:none !important;}
  .main.is-embed .content-head,.main.is-embed .content-body{display:none;}
  .embed-toolbar{height:50px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg-2);}
  .embed-toolbar .e-title{font-weight:700;font-size:14px;color:var(--ink);white-space:nowrap;}
  .embed-toolbar .e-url{flex:1;min-width:0;font-size:12px;color:var(--txt-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #embedFrame{flex:1;border:0;width:100%;height:100%;background:var(--bg);}
  .embed-fallback{position:absolute;inset:50px 0 0 0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:var(--bg);z-index:2;}
  .embed-fallback.show{display:flex;}
  .embed-fallback .ef-icon{font-size:46px;opacity:.8;}
  .embed-fallback .ef-title{font-size:16px;font-weight:700;color:var(--ink);}
  .embed-fallback .ef-sub{font-size:13px;color:var(--txt-2);max-width:440px;line-height:1.8;}

  /* 响应式 */
  @media (max-width:900px){
    .sidebar{position:fixed;top:54px;left:0;bottom:0;z-index:35;box-shadow:var(--shadow-lg);}
    .sidebar.collapsed{margin-left:0;transform:translateX(-100%);}
    .content-head{padding:10px 16px 6px;}
    .ch-top{flex-direction:column;gap:8px;margin-bottom:6px;}
    .ch-actions{width:100%;}
    .ch-actions .btn{flex:1;min-height:26px;padding:0 10px;}
    .cards{grid-template-columns:1fr;}
  }
  @media (max-width:640px){
    .app-topbar .t-sub{display:none;}
    .app-topbar .btn-text{display:none;}
    .app-topbar{gap:6px;padding:8px 10px;}
    .status-tag{display:none;}
    .ch-filterbar{flex-wrap:wrap;}
    .ch-search-wrap{max-width:none;width:100%;}
    .ch-tabs{width:100%;}
    .content-body{padding:10px 16px 20px;}
    .form-grid{grid-template-columns:1fr;}
  }

  /* 本台服务下拉菜单 */
  .self-menu-wrap{position:relative;}
  .self-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:60;min-width:188px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;animation:pop .14s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
  .self-menu .sm-head{padding:8px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;}
  .self-menu .sm-name{font-weight:700;color:var(--ink);font-size:13.5px;}
  .self-menu .sm-meta{font-size:11.5px;color:var(--txt-3);margin-top:2px;}
  .self-menu button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:none;background:none;border-radius:8px;font-size:13px;font-weight:600;color:var(--txt);cursor:pointer;text-align:left;}
  .self-menu button:hover{background:var(--bg-3);}
  .self-menu button.danger{color:var(--danger);}
  .self-menu button.danger:hover{background:var(--danger-soft);}
  .self-menu svg{color:var(--txt-2);flex:none;}
  .self-menu button.danger svg{color:var(--danger);}

  /* 文件管理器 */
  .file-view{display:flex;height:100%;gap:0;}
  .file-roots{width:270px;flex:none;border-right:1px solid var(--line);overflow:hidden;padding:12px 10px;background:var(--bg-2);display:flex;flex-direction:column;transition:width .22s ease;position:relative;}
  .file-roots.collapsed{width:44px;}
  .file-roots.collapsed .fr-head,.file-roots.collapsed .fr-search,.file-roots.collapsed .fr-list{display:none;}
  .fr-head{display:flex;align-items:center;justify-content:space-between;padding:0 8px;margin-bottom:8px;}
  .fr-title{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--txt-3);text-transform:uppercase;white-space:nowrap;}
  .fr-collapse{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--bg-3);color:var(--txt-2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s;}
  .fr-collapse:hover{background:var(--card);color:var(--ink);}
  .fr-search{position:relative;margin-bottom:10px;}
  .fr-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--txt-3);}
  .fr-search input{width:100%;padding:6px 8px 6px 28px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg-3);font-size:12.5px;color:var(--txt);outline:none;}
  .fr-search input:focus{border-color:var(--navy);box-shadow:0 0 0 2px var(--primary-soft);}
  .fr-search input::placeholder{color:var(--txt-3);}
  .fr-list{flex:1;overflow-y:auto;}
  .fr-strip{display:none;flex:none;width:44px;height:100%;align-items:center;justify-content:center;background:var(--bg-2);cursor:pointer;}
  .fr-strip button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg-3);color:var(--txt-2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s;}
  .fr-strip button:hover{background:var(--card);color:var(--ink);}
  .file-roots.collapsed .fr-strip{display:flex;position:absolute;inset:0;}
  .fr-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--txt);border:1px solid transparent;}
  .fr-item:hover{background:var(--card);border-color:var(--line);}
  .fr-item.active{background:var(--card);border-color:var(--line-2);box-shadow:var(--shadow-sm);}
  .fr-item svg{color:var(--navy);flex:none;}
  .fr-sub{font-size:11px;color:var(--txt-3);margin-left:auto;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .file-main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);}
  .file-list{flex:1;overflow-y:auto;padding:8px 12px 24px;}
  .file-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent;}
  .file-row:hover{background:var(--bg-2);border-color:var(--line);}
  .file-row.sel{background:var(--primary-soft);border-color:rgba(59,130,246,.35);}
  .file-ico{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:10px;}
  .file-ico.dir{background:linear-gradient(135deg,#3b82f6,#06b6d4);}
  .file-ico.file{background:linear-gradient(135deg,#475569,#64748b);}
  .file-meta{flex:1;min-width:0;}
  .file-name{font-size:13.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .file-info{font-size:11.5px;color:var(--txt-3);margin-top:1px;}
  .file-empty{padding:60px 20px;text-align:center;color:var(--txt-3);}
  .file-empty svg{color:var(--txt-3);}
  .file-loading{padding:40px;text-align:center;color:var(--txt-3);}
  /* 文件视图缩放 */
  .file-list{--file-size:1;}
  .file-list.file-scale-0{--file-size:0.82;}
  .file-list.file-scale-2{--file-size:1.22;}
  .file-row{padding:calc(9px * var(--file-size)) calc(10px * var(--file-size));gap:calc(10px * var(--file-size));}
  .file-ico{width:calc(30px * var(--file-size));height:calc(30px * var(--file-size));border-radius:calc(8px * var(--file-size));font-size:calc(10px * var(--file-size));}
  .file-name{font-size:calc(13.5px * var(--file-size));}
  .file-info{font-size:calc(11.5px * var(--file-size));}

  /* 右键菜单 */
  .ctx-menu{position:fixed;z-index:80;min-width:172px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:5px;animation:pop .12s ease;}
  .ctx-menu button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:none;background:none;border-radius:7px;font-size:13px;font-weight:600;color:var(--txt);cursor:pointer;text-align:left;}
  .ctx-menu button:hover{background:var(--bg-3);}
  .ctx-menu button.danger{color:var(--danger);}
  .ctx-menu button.danger:hover{background:var(--danger-soft);}
  .ctx-menu .ctx-sep{height:1px;background:var(--line);margin:4px 6px;}

  /* 编辑器 / 注册 弹窗 */
  .editor-area{width:100%;min-height:340px;max-height:60vh;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;padding:12px;color:var(--txt);background:var(--bg-soft);border:1px solid var(--line-2);border-radius:10px;resize:vertical;outline:none;}
  .editor-area:focus{border-color:var(--navy);box-shadow:0 0 0 2px var(--primary-soft);}
  .editor-meta{font-size:12px;color:var(--txt-3);margin:8px 2px 0;word-break:break-all;}

  /* ============ 启动页 Landing ============ */
  #landing{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(1200px 720px at 50% -12%,#1b2f63 0%,#0c1733 55%,#070d20 100%);color:#eaf0ff;transition:opacity .6s ease, transform .6s ease;}
  #landing.hide{opacity:0;transform:scale(1.04);pointer-events:none;}
  .landing-bg{position:absolute;inset:-20px;background:center/cover no-repeat;filter:blur(14px) brightness(0.8) saturate(1.1);transform:scale(1.08);transition:background-image 1.2s ease-in-out;}
  .landing-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(1200px 720px at 50% -12%,rgba(27,47,99,.7) 0%,rgba(12,23,51,.85) 55%,rgba(7,13,32,.95) 100%);}
  .landing-particles{position:absolute;inset:0;z-index:1;pointer-events:none;}
  .landing-card{position:relative;z-index:2;text-align:center;padding:34px 32px 40px;max-width:620px;animation:rise .7s cubic-bezier(.22,1,.36,1);background:rgba(13,17,23,.45);border:1px solid rgba(255,255,255,.10);border-radius:var(--radius-lg);backdrop-filter:blur(16px);box-shadow:0 24px 80px rgba(0,0,0,.45);}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  .landing-logo{width:90px;height:90px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;filter:drop-shadow(0 6px 20px rgba(59,130,246,.4));}
  .landing-logo img{width:100%;height:100%;object-fit:contain;background:transparent;border:none;}
  @keyframes lpulse{0%,100%{box-shadow:0 12px 44px rgba(59,130,246,.45)}50%{box-shadow:0 12px 64px rgba(6,182,212,.62)}}
  .landing-title{font-size:40px;font-weight:900;letter-spacing:3px;margin:0;background:linear-gradient(120deg,#fff,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .landing-sub{margin:10px 0 26px;font-size:15px;color:#8fa5d0;letter-spacing:.5px;}
  .landing-enter{display:inline-flex;align-items:center;gap:10px;padding:14px 40px;font-size:16px;font-weight:800;border:none;border-radius:14px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#3b82f6,#06b6d4);box-shadow:0 12px 34px rgba(59,130,246,.45);transition:transform .15s,box-shadow .15s;}
  .landing-enter:hover{transform:translateY(-2px);box-shadow:0 16px 46px rgba(6,182,212,.58);}
  .landing-enter:active{transform:translateY(0);}
  .landing-clock{font-size:48px;font-weight:800;letter-spacing:2px;color:#fff;text-shadow:0 4px 20px rgba(59,130,246,.35);font-variant-numeric:tabular-nums;margin:-6px 0 18px;}
  .landing-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:28px;}
  .lstat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px 8px;backdrop-filter:blur(8px);transition:transform .15s,background .15s;}
  .lstat:hover{transform:translateY(-2px);background:rgba(255,255,255,.10);}
  .lstat .v{font-size:18px;font-weight:800;color:#eaf0ff;}
  .lstat .v.ok{color:#4ade80;}
  .lstat .k{font-size:11px;color:#8fa5d0;margin-top:4px;}
  .lstat .bar{height:4px;border-radius:999px;background:rgba(255,255,255,.12);margin-top:10px;overflow:hidden;}
  .lstat .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#3b82f6,#06b6d4);transition:width .6s ease;}
  .landing-loading{font-size:12.5px;color:#8fa5d0;margin-top:16px;display:flex;align-items:center;gap:8px;justify-content:center;}
  .landing-meta{font-size:11.5px;color:#6b82b0;margin-top:14px;letter-spacing:.3px;}
  .landing-loading .sp{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .7s linear infinite;}
  .landing-wrap{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:28px;width:100%;max-width:1280px;padding:0 24px;}
  .landing-deco{width:280px;height:560px;flex:none;border-radius:var(--radius-lg);overflow:hidden;position:relative;pointer-events:none;opacity:.85;transition:opacity .3s,transform .3s;}
  .landing-deco::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,17,23,.22),rgba(13,17,23,.62));z-index:1;}
  .landing-deco::after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.10);border-radius:var(--radius-lg);z-index:2;box-shadow:0 18px 60px rgba(0,0,0,.35),inset 0 0 40px rgba(59,130,246,.08);}
  .landing-deco img{width:100%;height:100%;object-fit:cover;transform:scale(1.05);animation:decoPan 24s ease-in-out infinite alternate;}
  .landing-deco-left{margin-top:-30px;animation:float 6s ease-in-out infinite;}
  .landing-deco-right{margin-top:30px;animation:float 6s ease-in-out infinite;animation-delay:3s;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes decoPan{from{transform:scale(1.05) translate(0,0)}to{transform:scale(1.12) translate(-8px,-12px)}}
  .landing-corner-icon{position:absolute;top:24px;right:24px;z-index:3;width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:#fff;background:transparent;border:none;}
  .landing-corner-icon img{width:100%;height:100%;object-fit:contain;background:transparent;border:none;}
  @media (max-width:1080px){ .landing-deco{display:none;} .landing-wrap{justify-content:center;} }

  /* ============ 控制台侧栏 ============ */
  .console-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px;border:none;background:none;border-radius:12px;cursor:pointer;text-align:left;border:1px solid transparent;transition:background .14s,border-color .14s,box-shadow .14s,transform .1s;}
  .console-item:hover{background:var(--card-hover);border-color:var(--line-2);transform:translateX(2px);color:var(--ink);}
  .console-item.active{background:#fff;border-color:rgba(79,70,229,.25);box-shadow:var(--shadow-sm);}
  .console-item.active .ci-name{color:var(--indigo);}
  .ci-ico{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#4f46e5,#7c3aed);box-shadow:0 4px 10px rgba(79,70,229,.18);}
  .console-item.active .ci-ico{background:linear-gradient(135deg,#2563eb,#4f46e5);}
  .ci-meta{flex:1;min-width:0;}
  .ci-name{display:block;font-size:13.5px;font-weight:700;color:var(--ink);transition:color .15s;}
  .ci-desc{display:block;font-size:11px;color:var(--txt-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sidebar.collapsed .ci-desc{display:none;}
  .sidebar.collapsed .sidebar-head,.sidebar.collapsed .sidebar-foot span{display:none;}
  .sidebar.collapsed .sidebar-foot{justify-content:center;padding:14px 0;}

  /* ============ 通用 section 头部 ============ */
  .section-head{padding:18px 22px 6px;}
  .section-head h1{margin:0;font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.3px;}
  .section-head p{margin:3px 0 0;font-size:13px;color:var(--txt-2);}
  .banner{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(210,153,34,.12),rgba(210,153,34,.06));border:1px solid rgba(210,153,34,.25);border-radius:12px;padding:12px 16px;margin:14px 22px 0;font-size:13px;color:var(--warn);flex-wrap:wrap;}

  /* ============ 顶部状态栏 ============ */
  .top-statusbar{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:10px;padding:10px 22px;background:var(--bg-2);border-bottom:1px solid var(--line);font-size:12px;}
  .ts-item{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:8px;background:var(--bg-3);border:1px solid var(--line);color:var(--txt-2);}
  .ts-item b{font-weight:700;color:var(--ink);}
  .ts-item .dot{width:6px;height:6px;border-radius:50%;background:var(--mute);}
  .ts-item .dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);}
  .ts-item .dot.warn{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft);}
  .ts-item .dot.bad{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft);}
  .ts-spacer{flex:1;}
  .ts-activity{color:var(--txt-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px;}

  /* ============ 资产仪表盘 ============ */
  .dash-hero{position:relative;overflow:hidden;border-radius:var(--radius-lg);padding:26px 28px;margin-bottom:22px;background:linear-gradient(135deg,#111827 0%,#0d1117 55%,#0f172a 100%);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-lg);}
  .dash-hero::before{content:"";position:absolute;right:-60px;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.45),transparent 65%);filter:blur(2px);}
  .dash-hero::after{content:"";position:absolute;left:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(6,182,212,.30),transparent 65%);filter:blur(2px);}
  .dh-inner{position:relative;z-index:1;}
  .dh-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#93bbfc;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.22);padding:4px 10px;border-radius:999px;margin-bottom:12px;}
  .dh-tag .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);}
  .dash-hero h2{margin:0;font-size:24px;font-weight:800;letter-spacing:.5px;}
  .dash-hero p{margin:8px 0 18px;font-size:14px;color:var(--txt-2);max-width:560px;line-height:1.6;}
  .dh-actions{display:flex;gap:10px;flex-wrap:wrap;}

  /* 概括页 hero 上移：替代 .ch-top，操作按钮放右侧 */
  .overview-hero-wrap{display:none;}
  .content-head.is-overview .ch-top{display:none;}
  .content-head.is-overview .overview-hero-wrap{display:block;}
.ov-hero{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:7px 22px;margin:-12px -22px 3px;background:linear-gradient(135deg,#111827 0%,#0d1117 55%,#0f172a 100%);color:var(--ink);border-bottom:1px solid var(--line);overflow:hidden;}
.ov-hero::before{content:"";position:absolute;right:-90px;top:-100px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.40),transparent 65%);filter:blur(2px);}
.ov-hero::after{content:"";position:absolute;left:-55px;bottom:-75px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(6,182,212,.26),transparent 65%);filter:blur(2px);}
.ov-hero-left{position:relative;z-index:1;flex:1;min-width:220px;}
.ov-hero-tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:#93bbfc;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.22);padding:2px 8px;border-radius:999px;margin-bottom:2px;}
.ov-hero-tag .dot{width:5px;height:5px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 1.5px var(--ok-soft);}
.ov-hero h2{margin:0;font-size:17px;font-weight:800;letter-spacing:.3px;color:#f8fafc;}
.ov-hero p{margin:2px 0 0;font-size:12px;color:#94a3b8;max-width:520px;line-height:1.45;}
.ov-hero-right{gap:6px;}
  .ov-hero-right{position:relative;z-index:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.dash-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px;}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;display:flex;align-items:center;gap:11px;transition:box-shadow .15s,transform .15s,border-color .15s,background .15s;}
.stat-card:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-1px);background:var(--card-hover);}
.stat-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;}
.stat-main{flex:1;min-width:0;}
.stat-value{font-size:18px;font-weight:800;color:var(--ink);line-height:1.1;}
.stat-label{font-size:11px;color:var(--txt-3);margin-top:2px;font-weight:600;}
  .dash-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:12px;}
  .cat-card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 14px;cursor:pointer;transition:all .15s;text-align:left;border-top:3px solid transparent;}
  .cat-card:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-2px);background:var(--card-hover);}
  .cat-card.active{border-color:rgba(59,130,246,.35);background:linear-gradient(135deg,var(--card),rgba(59,130,246,.10));border-top-color:var(--indigo);}
  .cat-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:12px;}
  .cat-name{font-size:13.5px;font-weight:750;color:var(--ink);}
  .cat-count{font-size:12px;color:var(--txt-3);margin-top:3px;font-weight:600;}
  .cat-card.active .cat-name{color:var(--navy);}
  .cat-card .cat-glow{position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;opacity:.18;filter:blur(8px);}

  /* Bento 仪表盘 */
.bento-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-bottom:16px;}
.bento-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:15px;display:flex;flex-direction:column;max-height:360px;overflow:auto;transition:border-color .15s,box-shadow .15s,background .15s;}
  .bento-card:hover{border-color:var(--line-2);background:var(--card-hover);}
  .bento-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .bento-head .bh-ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;}
  .bento-head h3{margin:0;font-size:14px;font-weight:750;color:var(--ink);flex:1;}
  .bento-head .bh-count{font-size:12px;color:var(--txt-3);font-weight:600;}
  .bento-cats{grid-column:span 7;min-height:260px;}
  .bento-cats .dash-cats{margin-bottom:0;}
  .bento-quick{grid-column:span 5;}
  .quick-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .quick-card{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--bg-3);border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;text-align:left;transition:background .15s,border-color .15s,transform .15s;}
  .quick-card:hover{background:var(--card-active);border-color:var(--line-2);transform:translateY(-2px);}
  .quick-card .qc-top{display:flex;align-items:center;gap:10px;}
  .quick-card .qc-ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;}
  .quick-card .qc-name{font-size:13.5px;font-weight:750;color:var(--ink);}
  .quick-card .qc-desc{font-size:11.5px;color:var(--txt-3);line-height:1.45;font-weight:500;}
  .quick-card .qc-glow{position:absolute;right:-14px;top:-14px;width:56px;height:56px;border-radius:50%;opacity:.16;filter:blur(8px);}
  .bento-services{grid-column:span 5;}
  .svc-list{display:flex;flex-direction:column;gap:8px;}
  .svc-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg-3);border:1px solid var(--line);cursor:pointer;transition:background .12s,border-color .12s;}
  .svc-row:hover{background:var(--card-active);border-color:var(--line-2);}
  .svc-row .dot{width:7px;height:7px;border-radius:50%;background:var(--mute);}
  .svc-row .dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);}
  .svc-row .dot.bad{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft);}
  .svc-name{flex:1;font-size:13px;font-weight:600;color:var(--ink);}
  .svc-meta{font-size:11.5px;color:var(--txt-3);}
  .bento-scripts{grid-column:span 7;}
  .script-list{display:flex;flex-direction:column;gap:8px;}
  .script-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg-3);border:1px solid var(--line);cursor:pointer;transition:background .12s,border-color .12s;}
  .script-row:hover{background:var(--card-active);border-color:var(--line-2);}
  .script-row .sr-ico{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#3b82f6,#06b6d4);flex:none;}
  .script-row .sr-name{flex:1;font-size:13px;font-weight:600;color:var(--ink);}
  .script-row .sr-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(46,160,67,.15);color:var(--ok);}

  /* 概括页网格 */
  .overview-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-bottom:16px;}
  .overview-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s,background .15s;}
  .overview-card:hover{border-color:var(--line-2);background:var(--card-hover);}
  .sys-status-card{grid-column:span 6;}
  .self-mini-card{grid-column:span 3;}
  .clock-card{grid-column:span 3;}
  .sysmon-mini-card{grid-column:span 6;}
  .dash-mini-card{grid-column:span 6;}
  /* 概括页常开迷你实时监控卡 */
  .ov-live{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;color:var(--mute);background:var(--bg-3);transition:color .2s,background .2s;white-space:nowrap;}
  .ov-live.ok{color:var(--ok);background:var(--ok-soft);}
  .ov-live.bad{color:var(--danger);background:var(--danger-soft);}
  .ov-refresh{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;background:transparent;border:1px solid var(--line);color:var(--txt-2);cursor:pointer;transition:background .15s,border-color .15s,color .15s;}
  .ov-refresh:hover{background:var(--card-active);border-color:var(--line-2);color:var(--ink);}
  .ov-refresh:active{transform:scale(.96);}
  .ov-refresh.spin svg{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .ov-mini-body{padding-top:6px;}
  .ov-muted{padding:20px 4px;text-align:center;font-size:13px;color:var(--txt-3);}
  .ov-muted button{margin-top:10px;}
  .ov-loading,.ov-err{padding:22px 4px;text-align:center;font-size:13px;color:var(--txt-3);}
  .ov-err{color:var(--danger);font-weight:600;}
  .ov-rows{display:flex;flex-direction:column;gap:12px;}
  .ov-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .ov-k{font-size:12.5px;font-weight:600;color:var(--txt-2);flex:none;}
  .ov-val{font-size:13.5px;font-weight:800;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;}
  .ov-val.wrap{max-width:64%;white-space:normal;line-height:1.35;}
  .ov-bar{height:6px;border-radius:999px;background:var(--bg-3);overflow:hidden;margin-top:6px;}
  .ov-bar i{display:block;height:100%;border-radius:999px;transition:width .4s ease;}
  .ov-sub{font-size:11px;color:var(--txt-3);text-align:right;margin-top:3px;font-variant-numeric:tabular-nums;}
  /* 系统状态卡 */
  .sys-status-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
  .sys-item{display:flex;flex-direction:column;gap:8px;}
  .sys-top{display:flex;align-items:center;gap:10px;}
  .sys-ico{width:30px;height:30px;border-radius:9px;background:var(--bg-3);display:flex;align-items:center;justify-content:center;color:var(--navy);flex:none;}
  .sys-label{flex:1;font-size:13px;font-weight:600;color:var(--txt-2);}
  .sys-value{font-size:18px;font-weight:800;color:var(--ink);}
  .sys-bar{height:6px;border-radius:999px;background:var(--bg-3);overflow:hidden;}
  .sys-bar i{display:block;height:100%;border-radius:999px;transition:width .4s ease;}
  .sys-sub{font-size:11.5px;color:var(--txt-3);}
  /* 本台服务迷你卡 */
  .self-mini-grid{display:grid;grid-template-columns:repeat(1,1fr);gap:10px;margin-bottom:12px;}
  .sm-stat{display:flex;align-items:center;justify-content:space-between;background:var(--bg-3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .sm-label{font-size:12px;color:var(--txt-2);}
  .sm-value{font-size:14px;font-weight:800;color:var(--ink);}
  .sm-value.ok{color:var(--ok);}
  .sm-value.bad{color:var(--danger);}
  .self-mini-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
  .self-mini-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--txt-2);}
  .self-uptime{font-size:12px;font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums;}
  /* 时间卡 */
  .clock-card{align-items:center;text-align:center;}
  .clock-time{font-size:42px;font-weight:800;color:var(--ink);letter-spacing:1px;line-height:1;font-variant-numeric:tabular-nums;margin:4px 0 6px;}
  .clock-date{font-size:14px;color:var(--txt-2);margin-bottom:14px;}
  .clock-week{font-size:12px;font-weight:700;color:var(--navy);background:var(--primary-soft);padding:3px 9px;border-radius:999px;}
  .mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;width:100%;}
  .mini-cal .cal-head{font-size:10px;color:var(--txt-3);text-align:center;}
  .mini-cal .cal-day{font-size:11px;font-weight:600;color:var(--txt-2);text-align:center;padding:5px 0;border-radius:6px;}
  .mini-cal .cal-day.today{background:var(--primary);color:#fff;}

  /* 卡片类型色条 */
  .card{border-top:3px solid transparent;}
  .card.type-app{border-top-color:#3b82f6;} .card.type-web{border-top-color:#10b981;} .card.type-web-service{border-top-color:#06b6d4;}
  .card.type-port{border-top-color:#64748b;} .card.type-mini-program{border-top-color:#8b5cf6;} .card.type-script{border-top-color:#d97706;}
  .card.type-attachment{border-top-color:#a855f7;} .card.type-file{border-top-color:#64748b;} .card.type-tool{border-top-color:#d97706;}
  .card .c-status-dot{position:absolute;top:14px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--line-strong);}
  .card .c-status-dot.online{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);}

  @media (max-width:1200px){
    .bento-cats,.bento-scripts{grid-column:span 8;}
    .bento-quick,.bento-services{grid-column:span 4;}
  }
  @media (max-width:900px){
    .dash-stats{grid-template-columns:repeat(2,1fr);}
    .dash-hero h2{font-size:20px;}
    .bento-cats,.bento-quick,.bento-services,.bento-scripts{grid-column:span 12;}
  }
  @media (max-width:640px){
    .top-statusbar{flex-wrap:wrap;padding:10px 16px;}
    .ts-activity{display:none;}
    .dash-stats{grid-template-columns:1fr 1fr;}
    .dash-cats{grid-template-columns:repeat(2,1fr);}
    .dash-hero{padding:20px;}
    .quick-actions{grid-template-columns:1fr;}
  }

  /* ============ 本台服务面板 ============ */
  .self-panel{max-width:920px;margin:0 auto;}
  .self-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px;}
  .self-stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:4px;}
  .self-stat .sk{font-size:12px;color:var(--txt-3);font-weight:600;}
  .self-stat .sv{font-size:20px;font-weight:800;color:var(--ink);}
  .self-stat .sv.ok{color:var(--ok);} .self-stat .sv.bad{color:var(--danger);}
  .self-actions{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 18px;}
  .self-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;}
  .self-row .sr-info b{font-size:14px;color:var(--ink);} .self-row .sr-info p{margin:3px 0 0;font-size:12.5px;color:var(--txt-2);}
  .switch{position:relative;width:46px;height:26px;flex:none;border:none;border-radius:999px;background:var(--line-strong);cursor:pointer;transition:background .2s;}
  .switch.on{background:var(--indigo);}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .2s;box-shadow:var(--shadow-sm);}
  .switch.on::after{transform:translateX(20px);}

  /* ============ 工具箱 ============ */
  .tool-layout{display:flex;height:100%;gap:0;zoom:var(--tz,1);}
  .tool-scale-0{--tz:.82;}
  .tool-scale-2{--tz:1.32;}
  .tool-sidebar{width:260px;flex:none;border-right:1px solid var(--line);background:var(--bg-2);display:flex;flex-direction:column;overflow:hidden;transition:width .22s ease;position:relative;}
  .tool-sidebar.collapsed{width:44px;}
  .tool-sidebar-head{padding:16px 16px 8px;position:relative;}
  .tool-sidebar.collapsed .tool-sidebar-head{display:none;}
  .tsh-brand{display:flex;align-items:center;gap:10px;}
  .tsh-ico{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#06b6d4);display:flex;align-items:center;justify-content:center;color:#fff;}
  .tool-sidebar-head h2{margin:0;font-size:15px;font-weight:800;color:var(--ink);}
  .tool-sidebar-head p{margin:4px 0 0;font-size:12px;color:var(--txt-3);}
  .tsh-collapse{position:absolute;top:12px;right:10px;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg-3);color:var(--txt-2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s;}
  .tsh-collapse:hover{background:var(--card);color:var(--ink);}
  .tool-sidebar-strip{display:none;flex:none;width:44px;height:100%;align-items:center;justify-content:center;background:var(--bg-2);cursor:pointer;}
  .tool-sidebar-strip button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg-3);color:var(--txt-2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s;}
  .tool-sidebar-strip button:hover{background:var(--card);color:var(--ink);}
  .tool-sidebar.collapsed .tool-sidebar-strip{display:flex;}
  .tool-sidebar.collapsed .tool-sidebar-list{display:none;}
  .tz-controls{display:flex;align-items:center;gap:6px;margin-top:10px;}
  .tz-controls .btn-icon{width:26px;height:26px;padding:0;font-size:16px;line-height:1;}
  .tz-label{font-size:12px;color:var(--txt-3);min-width:40px;text-align:center;}
  .tool-sidebar-list{flex:1;overflow-y:auto;padding:8px 12px 12px;}
  .tool-sidebar.collapsed .tool-sidebar-list{display:none;}
  .tool-sidebar-group{margin-bottom:16px;}
  .tsg-title{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--txt-3);text-transform:uppercase;padding:0 6px;margin-bottom:6px;}
  .tsg-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:all .12s;}
  .tsg-item:hover{background:var(--card);border-color:var(--line);}
  .tsg-item.active{background:var(--card);border-color:var(--line-2);}
  .tsg-item .ti{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#3b82f6,#06b6d4);flex:none;font-size:11px;}
  .tsg-item .tm{flex:1;min-width:0;}
  .tsg-item .tn{font-size:13px;font-weight:600;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tsg-item .td{font-size:11px;color:var(--txt-3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tsg-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--txt-4,#c5ccd6);box-shadow:0 0 0 2px rgba(0,0,0,.04);transition:background .2s,box-shadow .2s;}
  .tsg-dot.on{background:#22c55e;box-shadow:0 0 0 2px rgba(34,197,94,.18);}
  .tool-main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);position:relative;}
  .tool-welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 30px;gap:16px;color:var(--txt-2);}
  .tool-welcome .tw-ico{width:96px;height:96px;border-radius:26px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--navy);box-shadow:var(--shadow);}
  .tool-welcome h3{margin:0;font-size:18px;font-weight:800;color:var(--ink);}
  .tool-welcome p{margin:0;font-size:13px;max-width:380px;color:var(--txt-2);line-height:1.6;}
  .tool-groups{display:flex;flex-direction:column;gap:22px;}
  .tool-group-head{display:flex;align-items:center;gap:8px;margin:0 0 12px;}
  .tool-group-head .g-bar{width:3px;height:16px;border-radius:2px;background:linear-gradient(180deg,#3b82f6,#06b6d4);}
  .tool-group-head h3{margin:0;font-size:14px;font-weight:750;color:var(--ink);}
  .tool-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:14px;}
  .tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s,background .15s;position:relative;overflow:hidden;}
  .tcard:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-2px);background:var(--card-hover);}
  .tc-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#3b82f6,#06b6d4);}
  .tc-name{font-size:15px;font-weight:750;color:var(--ink);}
  .tc-desc{font-size:12.5px;color:var(--txt-2);line-height:1.55;flex:1;min-height:36px;}
  .tc-foot{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--txt-3);}
  .tc-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bg-3);color:var(--txt-2);}
  .tc-badge.web{background:rgba(6,182,212,.15);color:#22d3ee;} .tc-badge.script{background:rgba(210,153,34,.15);color:var(--warn);} .tc-badge.ext{background:rgba(139,92,246,.15);color:#a78bfa;}
  .tcard.tc-disabled{opacity:.5;}
  .tcard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#3b82f6,#06b6d4);opacity:0;transition:opacity .15s;}
  .tcard:hover::before{opacity:1;}
  .tool-hero{position:relative;overflow:hidden;border-radius:var(--radius-lg);padding:22px 24px;margin-bottom:22px;background:linear-gradient(135deg,#111827 0%,#0d1117 100%);border:1px solid var(--line);color:var(--ink);}
  .tool-hero::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.22),transparent 65%);}
  .tool-hero h2{margin:0;font-size:20px;font-weight:800;}
  .tool-hero p{margin:8px 0 0;font-size:13.5px;color:var(--txt-2);max-width:560px;line-height:1.6;}
  .tool-ws-bar{background:var(--card);box-shadow:var(--shadow-sm);border-bottom:1px solid var(--line);}
  .tool-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 20px;gap:14px;color:var(--txt-2);background:var(--bg);}
  .tool-empty .te-ico{width:80px;height:80px;border-radius:22px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--navy);box-shadow:var(--shadow);}

  /* 工具工作区（覆盖 content） */
  .main.is-tool .content-head,.main.is-tool .content-body{display:none;}
  .tool-workspace{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg);}
  .tool-workspace[hidden]{display:none !important;}
  .content-body.tool-mode{padding:0;overflow:auto;}
  .tsg-disabled{opacity:.5;cursor:not-allowed;pointer-events:none;}
  @media (max-width:720px){ .tool-layout{flex-direction:column;height:auto;min-height:100%;} .tool-sidebar{width:100%;border-right:0;border-bottom:1px solid var(--line);max-height:220px;} }
  .tool-ws-bar{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg-2);}
  .tool-ws-bar .e-title{font-weight:700;font-size:14px;color:var(--ink);}
  .tool-ws-bar .e-sub{font-size:12px;color:var(--txt-3);}
  .tool-ws-body{flex:1;min-height:0;display:flex;flex-direction:column;}
  .tool-frame{flex:1;border:0;width:100%;height:100%;background:var(--bg);}
  .tool-script-panel{padding:16px;display:flex;flex-direction:column;gap:14px;height:100%;overflow:auto;}
  .tool-status-line{display:flex;align-items:center;gap:10px;}
  .dot-st{width:9px;height:9px;border-radius:50%;background:var(--mute);}
  .dot-st.run{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);}
  .dot-st.idle{background:var(--mute);}
  .tool-log{background:#070b12;color:#9ecbff;border-radius:12px;padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-all;flex:1;min-height:160px;overflow:auto;}
  /* 脚本工具前端页 */
  .tool-workspace-script .tool-ws-bar{padding-right:16px;}
  .tool-ws-title{display:flex;align-items:center;gap:10px;}
  .tool-ws-title .tw-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#3b82f6,#06b6d4);flex:none;}
  .tool-ws-title .e-title{display:block;font-size:14px;font-weight:700;color:var(--ink);}
  .tool-ws-title .e-sub{display:block;font-size:12px;color:var(--txt-3);margin-top:1px;}
  .tool-script-page{display:flex;flex-direction:column;gap:16px;padding:18px 20px;height:100%;overflow:auto;}
  .tsp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .tsp-status{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--txt-2);}
  .tsp-info{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .tinfo-row{display:flex;flex-direction:column;gap:3px;}
  .tinfo-k{font-size:11px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.5px;}
  .tinfo-v{font-size:13px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tsp-log-wrap{flex:1;min-height:180px;display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .tsp-log-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink);}
  .tsp-log-head svg{color:var(--navy);}

  /* 纯前端实用工具页 */
  .tool-workspace-local{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg);}
  .util-page{padding:18px 22px;height:100%;overflow:auto;}
  .util-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .util-stack{display:flex;flex-direction:column;gap:10px;max-width:760px;}
  .util-col{display:flex;flex-direction:column;gap:8px;min-width:0;}
  .util-label{font-size:12px;font-weight:700;color:var(--txt-3);text-transform:uppercase;letter-spacing:.4px;}
  .util-input{width:100%;min-height:150px;resize:vertical;padding:12px 13px;border-radius:11px;border:1px solid var(--line);background:var(--bg-3);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;transition:border-color .15s,background .15s;}
  .util-input:focus{outline:none;border-color:var(--primary);background:var(--bg-2);}
  .util-output{margin:0;min-height:150px;max-height:340px;overflow:auto;padding:12px 13px;border-radius:11px;border:1px solid var(--line);background:var(--bg-3);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-all;}
  .util-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .util-msg{font-size:12px;font-weight:600;color:var(--txt-3);}
  .util-row{display:flex;align-items:center;gap:10px;}
  .util-key{width:92px;flex:none;font-size:13px;font-weight:700;color:var(--txt-2);}
  .util-row .util-input{min-height:40px;height:40px;resize:none;flex:1;}
  .util-diff{margin-top:6px;border:1px solid var(--line);border-radius:11px;background:var(--bg-3);padding:10px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.7;max-height:380px;overflow:auto;white-space:pre-wrap;word-break:break-all;}
  .util-diff .dl{padding:1px 8px;border-radius:6px;}
  .util-diff .dl.eq{color:var(--txt-2);}
  .util-diff .dl.add{background:rgba(46,160,67,.14);color:#3fb950;}
  .util-diff .dl.del{background:rgba(248,81,73,.14);color:#ff7b72;}

  /* 原生应用控制台（脚本类） */
  .app-console{padding:18px 22px;height:100%;overflow:auto;display:flex;flex-direction:column;gap:16px;}
  .ac-hero{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,var(--card),var(--bg-2));border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px 22px;}
  .ac-logo{width:64px;height:64px;border-radius:18px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#3b82f6,#06b6d4);box-shadow:0 8px 22px rgba(59,130,246,.28);}
  .ac-logo svg{width:32px;height:32px;}
  .ac-meta{flex:1;min-width:0;}
  .ac-name{font-size:18px;font-weight:800;color:var(--ink);}
  .ac-desc{font-size:13px;color:var(--txt-2);margin-top:3px;line-height:1.55;}
  .ac-status{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--txt-2);}
  .ac-actions{display:flex;flex-direction:column;gap:8px;flex:none;}
  .btn-lg{min-height:44px;padding:0 20px;font-size:14.5px;}
  .ac-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .ac-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .ac-card-h{font-size:13px;font-weight:750;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .ac-prose{font-size:13px;color:var(--txt-2);line-height:1.65;}
  .ac-steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--txt-2);line-height:1.55;}
  .ac-kv{display:flex;flex-direction:column;gap:8px;}
  .ac-kv-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;}
  .ac-kv-row span{color:var(--txt-3);}
  .ac-kv-row b{color:var(--txt);font-weight:700;max-width:62%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ac-kv-path b{white-space:normal;word-break:break-all;}
  .ac-log-wrap{flex:1;min-height:200px;display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .ac-log-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink);}
  .ac-log-head svg{color:var(--navy);}

  /* 系统监控（独立服务前端） */
  .sysmon-page{padding:18px 22px;height:100%;overflow:auto;display:flex;flex-direction:column;gap:16px;}
  .sm-hero{display:flex;align-items:center;gap:20px;background:linear-gradient(135deg,var(--card),var(--bg-2));border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px 22px;}
  .sm-cpu{display:flex;flex-direction:column;align-items:flex-start;line-height:1;}
  .sm-cpu-val{font-size:42px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;}
  .sm-cpu-unit{font-size:12px;color:var(--txt-3);margin-top:4px;font-weight:700;}
  .sm-cpu-spark{flex:1;min-width:160px;max-width:420px;}
  .sm-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .sm-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .sm-card-h{font-size:13px;font-weight:750;color:var(--ink);margin-bottom:12px;}
  .sm-bar{height:12px;border-radius:999px;background:var(--bg-3);overflow:hidden;}
  .sm-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#3b82f6,#06b6d4);transition:width .5s ease;}
  .sm-card-txt{font-size:12.5px;color:var(--txt-2);margin-top:8px;font-variant-numeric:tabular-nums;}
  .sm-cores{display:flex;flex-wrap:wrap;gap:8px;}
  .sm-core{display:flex;flex-direction:column;align-items:center;gap:4px;width:46px;}
  .sm-core-bar{width:14px;height:46px;border-radius:999px;background:var(--bg-3);overflow:hidden;display:flex;align-items:flex-end;}
  .sm-core-bar i{display:block;width:100%;background:linear-gradient(180deg,#06b6d4,#3b82f6);border-radius:999px;transition:height .5s ease;}
  .sm-core-pct{font-size:10.5px;color:var(--txt-2);font-variant-numeric:tabular-nums;}
  .sm-disk-card .sm-disk{margin-bottom:8px;}
  .sm-disk-row{display:flex;align-items:center;gap:12px;font-size:13px;}
  .sm-disk-label{width:24px;font-weight:700;color:var(--txt-2);flex:none;}
  .sm-disk-bar{flex:1;height:10px;border-radius:999px;background:var(--bg-3);overflow:hidden;}
  .sm-disk-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#8b5cf6,#3b82f6);transition:width .5s ease;}
  .sm-disk-val{width:200px;flex:none;text-align:right;color:var(--txt-2);font-variant-numeric:tabular-nums;font-size:12.5px;}

  /* ===== 总览仪表盘 / 工具集合 ===== */

  .tc-h{font-size:13px;font-weight:700;color:var(--txt);margin-bottom:10px;}

  .tool-pre{white-space:pre-wrap;word-break:break-all;font-size:12.5px;line-height:1.6;color:var(--txt);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:0;}
  @media (max-width:900px){ .dash-grid{grid-template-columns:1fr;} .dash-hero{flex-wrap:wrap;} .dsk-val{width:auto;} }

  /* ===== 阅览室 reading-room ===== */

  .rr-tabs{display:flex;gap:6px;}

  .rr-tab.active{background:var(--ac-soft);border-color:var(--ac);color:var(--ac);font-weight:600;}
  .rr-body{flex:1;display:grid;grid-template-columns:200px 300px 1fr;min-height:0;}
  .rr-cats{display:flex;flex-direction:column;gap:6px;padding:14px 10px;overflow-y:auto;border-right:1px solid var(--bd);}

  .rr-cat:hover{border-color:var(--bd-2);}
  .rr-cat.active{background:var(--ac-soft);border-color:var(--ac);}
  .rr-cat-ico{font-size:18px;width:22px;text-align:center;}
  .rr-cat-name{flex:1;font-size:14px;}
  .rr-cat-badge{min-width:20px;text-align:center;font-size:11px;color:var(--txt-3);background:var(--bg-3);border-radius:10px;padding:1px 7px;}
